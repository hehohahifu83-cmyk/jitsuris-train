name: G3 の予測（L・L24・L24S 各 3 本、CPU、1 回だけ）

# 2026-11-13 Claude（g2-predict.yml を写した）。事前記録 bench/fixm_prereg_20261112.md・bench/silver24_prereg_20261113.md。
# 正解（非公開の ai-bridge labels/g3/final.jsonl、SHA 1162b620…）を固定したあとに 1 回だけ回す。ラベルは読まない。
# 依頼：independent_eval/g3_predict.request を「run g3-20261113-v1 once」にして push する。
# L  ＝ D2 run 41192849082 の ft_out_job2〜4（FT_LABELFIX=labelfix_v24 だけ、種子 1〜3）
# L24＝ run 41735353926 の ft_out_job1〜3（FT_LABELFIX=4 ファイル、種子 1〜3）。学習の commit の 4 ファイルの SHA を事前記録と照合する
#      （同じ入力・同じ道具での数え直しが 1,492 行、事前記録 2026-11-05 の追記）。
# L24S＝ run 43266270727 の ft_out_job1〜3（L24 の設定＋FT_SILVER=materials/model_corpora/silver/train_A.jsonl.gz・FT_SILVER_EPOCHS=1、種子 1〜3）。
#      学習の commit の銀のファイルの SHA を事前記録（先頭 0a06e0ffb7a28728）と照合する。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'independent_eval/g3_predict.request'

permissions:
  actions: read
  contents: write

concurrency:
  group: g3-20261113-v1-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 1 回だけの依頼と凍結のセットを確かめる
        id: gate
        run: |
          if [ "$(head -1 independent_eval/g3_predict.request)" != "run g3-20261113-v1 once" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ls independent_eval/predictions_g3/pred_*.json >/dev/null 2>&1; then echo "予測がもうある（1 回だけ）"; exit 1; fi
          echo "41bb6c1832c0e6659c0b56766253769fd303564499a93e5c98c7c97676d3051a  independent_eval/results/g3/g3.json" | sha256sum -c -
          echo "281e038bc3c5994b5e368416fedeb2023cb4a079300abc8c67f0d4b15aa5773c  independent_eval/results/g3/titles.json" | sha256sum -c -
          mkdir -p independent_eval/predictions_g3
          { echo "commit $(git rev-parse HEAD)"; sha256sum research/g3/g3_eval.py research/guard_dates/fix_m.py research/silver/rho_amount_guard.py \
              evaluate_independent.py .github/workflows/g3-predict.yml independent_eval/results/g3/g3.json independent_eval/results/g3/titles.json; } \
            > independent_eval/predictions_g3/run_record.txt
          cat independent_eval/predictions_g3/run_record.txt
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: 重み 9 本ぶんの場所を空ける
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with: { python-version: '3.11' }

      - name: CPU の推論の道具（ラベルの手伝いの予測と同じ版）
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' 'safetensors==0.8.0' sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 41192849082
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l-model

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 41735353926
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l24-model

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 43266270727
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l24s-model

      - name: 重みと学習の設定を事前記録と照合する
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          V24 = "materials/pool/labelfix_v24.jsonl"
          FOUR = "materials/pool/labelfix_v24.jsonl,materials/pool/labelfix_g24_b3.jsonl,materials/pool/labelfix_g24_sheet.jsonl,materials/pool/labelfix_g24_pool.jsonl"
          PREFIX = {"materials/pool/labelfix_v24.jsonl": "38271e8b446e", "materials/pool/labelfix_g24_b3.jsonl": "a9967e38e721",
                    "materials/pool/labelfix_g24_sheet.jsonl": "cf872de25a6c", "materials/pool/labelfix_g24_pool.jsonl": "d39ef5880713"}
          SILVER = "materials/model_corpora/silver/train_A.jsonl.gz"
          out = {}
          for tag, root, jobs, fix in (("l", "/tmp/l-model", (2, 3, 4), V24), ("l24", "/tmp/l24-model", (1, 2, 3), FOUR), ("l24s", "/tmp/l24s-model", (1, 2, 3), FOUR)):
              for k, j in enumerate(jobs, 1):
                  ck = Path(root) / f"ft_out_job{j}"
                  m = json.loads((ck / "manifest.json").read_text(encoding="utf-8"))
                  name, meta = next(iter(m["saved_model"]["weights"].items()))
                  got = hashlib.sha256((ck / name).read_bytes()).hexdigest()
                  env = (m.get("run") or {}).get("env") or {}
                  seed = str((m.get("run") or {}).get("seed"))
                  if got != meta["sha256"]:
                      raise SystemExit(f"{tag} job{j}: weight verification failed")
                  if env.get("FT_LABELFIX") != fix or env.get("FT_VALUEFIX") or str(env.get("FT_TITLE")) != "1" or seed != str(k):
                      raise SystemExit(f"{tag} job{j}: settings do not match the preregistration")
                  if tag == "l24s":
                      if env.get("FT_SILVER") != SILVER or str(env.get("FT_SILVER_EPOCHS")) != "1":
                          raise SystemExit(f"l24s job{j}: silver settings do not match the preregistration")
                      blob = subprocess.check_output(["git", "show", f"{m['commit']}:{SILVER}"])
                      if not hashlib.sha256(blob).hexdigest().startswith("0a06e0ffb7a28728"):
                          raise SystemExit(f"l24s job{j}: silver file at the training commit differs from the preregistration")
                  elif env.get("FT_SILVER"):
                      raise SystemExit(f"{tag} job{j}: unexpected FT_SILVER")
                  if tag in ("l24", "l24s"):
                      for f, pre in PREFIX.items():
                          blob = subprocess.check_output(["git", "show", f"{m['commit']}:{f}"])
                          if not hashlib.sha256(blob).hexdigest().startswith(pre):
                              raise SystemExit(f"{tag} job{j}: {f} at the training commit differs from the preregistration")
                  out[f"{tag}_job{j}"] = {"sha256": got, "seed": seed, "commit": m.get("commit"), "FT_LABELFIX": env.get("FT_LABELFIX"), "FT_TITLE": env.get("FT_TITLE"), "FT_SILVER": env.get("FT_SILVER")}
                  print(f"{tag} job{j} verified {got}")
          Path("independent_eval/predictions_g3").mkdir(parents=True, exist_ok=True)
          Path("independent_eval/predictions_g3/weights_sha256.json").write_text(json.dumps(out, indent=1) + "\n", encoding="utf-8")
          PY

      - name: 予測（9 本、ラベルは読まない）
        if: steps.gate.outputs.proceed == 'true'
        env: { TOKENIZERS_PARALLELISM: 'false' }
        run: |
          set -eu
          for j in 2 3 4; do
            python evaluate_independent.py predict --set independent_eval/results/g3/g3.json --checkpoint /tmp/l-model/ft_out_job$j \
              --out independent_eval/predictions_g3/pred_l_job$j.json --ledger independent_eval/predictions_g3/ledger.jsonl --device cpu \
              --titles independent_eval/results/g3/titles.json
          done
          for j in 1 2 3; do
            python evaluate_independent.py predict --set independent_eval/results/g3/g3.json --checkpoint /tmp/l24-model/ft_out_job$j \
              --out independent_eval/predictions_g3/pred_l24_job$j.json --ledger independent_eval/predictions_g3/ledger.jsonl --device cpu \
              --titles independent_eval/results/g3/titles.json
          done
          for j in 1 2 3; do
            python evaluate_independent.py predict --set independent_eval/results/g3/g3.json --checkpoint /tmp/l24s-model/ft_out_job$j \
              --out independent_eval/predictions_g3/pred_l24s_job$j.json --ledger independent_eval/predictions_g3/ledger.jsonl --device cpu \
              --titles independent_eval/results/g3/titles.json
          done
          echo "done g3-20261113-v1 (9 predictions)" > independent_eval/g3_predict.request

      - name: 途中で失敗したときも予測・台帳・記録を残す（再実行の前に回収して理由を書く）
        if: failure() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g3-predictions-partial
          path: independent_eval/predictions_g3/
          retention-days: 30
          if-no-files-found: ignore

      - name: 予測と台帳だけを保存
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent_eval/predictions_g3/ independent_eval/g3_predict.request
          git commit -m "G3 の予測（L・L24・L24S 各 3 本、自動、1 回だけ）"
          git pull --rebase origin main
          git push origin HEAD:main
