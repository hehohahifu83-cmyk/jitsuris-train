name: 辞書の公式データを取る（名前・コードだけ）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "materials/dict/fetch.request"

permissions:
  contents: write

concurrency:
  group: dict-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 道具
        run: python -m pip install pandas openpyxl xlrd pycountry
      - name: 取る
        run: |
          set -eu
          test "$(head -1 materials/dict/fetch.request)" = "fetch"
          python -I materials/dict/fetch_dict.py | tee /tmp/fetch.log
          { echo "done"; tail -20 /tmp/fetch.log; } > materials/dict/fetch.request
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/dict/
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "辞書の公式データを取った（自動・名前とコードだけ）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
