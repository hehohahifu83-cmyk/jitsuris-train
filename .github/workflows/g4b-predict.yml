name: G4b の予測（control-256・T1-256・L24 各 3 本、CPU、1 回だけ）

# 2026-11-26 Claude（g3-predict.yml を写した）。事前記録 bench/g4_prereg_20261118.md・bench/g4b_prereg_20261122.md。
# 正解（非公開の ai-bridge labels/g4b/final.jsonl、SHA bd3baa8d…）を固定したあとに 1 回だけ回す。ラベルは読まない。
# 依頼：independent_eval/g4b_predict.request を「run g4b-20261126-v1 once」にして push する。
# C（control-256）＝ run 44688386547 の ft_out_job1〜3（FT_ROWCTX なし、FT_MAX_LEN=256、種子 1〜3）
# T（T1-256）＝ 同じ run の ft_out_job4〜6（FT_ROWCTX=1・rowctx-v1、種子 1〜3）
# L24 ＝ run 41735353926 の ft_out_job1〜3（読むだけ）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'independent_eval/g4b_predict.request'

permissions:
  actions: read
  contents: write

concurrency:
  group: g4b-20261126-v1-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 1 回だけの依頼と凍結のセットを確かめる
        id: gate
        run: |
          if [ "$(head -1 independent_eval/g4b_predict.request)" != "run g4b-20261126-v1 once" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ls independent_eval/predictions_g4b/pred_*.json >/dev/null 2>&1; then echo "予測がもうある（1 回だけ）"; exit 1; fi
          echo "b452695332509f3b13c719c97e6be00caed4df41c16c8d02deb3efeee6195dfc  independent_eval/results/g4b/g4b.json" | sha256sum -c -
          echo "a9719e3556f7d99e7a10e6e53f7e235f6ad3beca0a931323fa2b47b2d7a175ff  independent_eval/results/g4b/titles.json" | sha256sum -c -
          mkdir -p independent_eval/predictions_g4b
          { echo "commit $(git rev-parse HEAD)"; sha256sum research/g4b/g4b_eval.py research/g4b/g4b_tokens.py research/fix_n/fix_n.py encoder_context.py \
              evaluate_independent.py .github/workflows/g4b-predict.yml independent_eval/results/g4b/g4b.json independent_eval/results/g4b/titles.json; } \
            > independent_eval/predictions_g4b/run_record.txt
          cat independent_eval/predictions_g4b/run_record.txt
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: 重み 9 本ぶんの場所を空ける
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with: { python-version: '3.11' }

      - name: CPU の推論の道具（ラベルの手伝いの予測と同じ版）
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' 'safetensors==0.8.0' sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 44688386547
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ct-model

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 41735353926
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l24-model

      - name: 重みと学習の設定を事前記録と照合する
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          FOUR = "materials/pool/labelfix_v24.jsonl,materials/pool/labelfix_g24_b3.jsonl,materials/pool/labelfix_g24_sheet.jsonl,materials/pool/labelfix_g24_pool.jsonl"
          PREFIX = {"materials/pool/labelfix_v24.jsonl": "38271e8b446e", "materials/pool/labelfix_g24_b3.jsonl": "a9967e38e721",
                    "materials/pool/labelfix_g24_sheet.jsonl": "cf872de25a6c", "materials/pool/labelfix_g24_pool.jsonl": "d39ef5880713"}
          SPEC = {"version": "rowctx-v1", "rows": 2, "max_cols": 9, "max_cell": 24, "max_header": 20}
          WANT = {"c_job1": "0b3765d5262d58dc704751978f2e4c0fe8e644e0055d48667977b37316debc7c", "c_job2": "53b148ac3793707132877a2a995e0530cd85d276e34e81aff3d3ef9681ebce13",
                  "c_job3": "f745789ed9b80f98b754dba93e40315e62ccd206b87314014292653597bfb021", "t_job4": "31fa3544b2c88d1bbbc68bc3189cc63c0705693d35e25c79465f90c76e14ce25",
                  "t_job5": "139601790e3e1d252b900aafedaccb4536666e7d78394f6e72556fc109bc197d", "t_job6": "e7af7ec00066d52903d6aa98f7c1dd4a8b8a17873a690667320494c056ce34f1",
                  "l24_job1": "201d9757040ae4bd27c35cc2a9baaba47c5110dbec404dd4cca1a487a312c180", "l24_job2": "981168cac01307a39e34aa24f36a6741c5484e4e6af2b5d3d4dd1cda2174ca76",
                  "l24_job3": "a6811a32a41641bc5fc90af2d1e42c558e9d870084712c58260d407fe6efe3af"}
          out, envs = {}, {}
          for tag, root, jobs in (("c", "/tmp/ct-model", (1, 2, 3)), ("t", "/tmp/ct-model", (4, 5, 6)), ("l24", "/tmp/l24-model", (1, 2, 3))):
              for k, j in enumerate(jobs, 1):
                  ck = Path(root) / f"ft_out_job{j}"
                  m = json.loads((ck / "manifest.json").read_text(encoding="utf-8"))
                  name, meta = next(iter(m["saved_model"]["weights"].items()))
                  got = hashlib.sha256((ck / name).read_bytes()).hexdigest()
                  env = (m.get("run") or {}).get("env") or {}
                  extra = m.get("extra") or {}
                  seed = str((m.get("run") or {}).get("seed"))
                  if got != meta["sha256"] or got != WANT[f"{tag}_job{j}"]:
                      raise SystemExit(f"{tag} job{j}: weight verification failed")
                  if env.get("FT_LABELFIX") != FOUR or env.get("FT_VALUEFIX") or env.get("FT_SILVER") or str(env.get("FT_TITLE")) != "1" or seed != str(k):
                      raise SystemExit(f"{tag} job{j}: settings do not match the preregistration")
                  if tag in ("c", "t"):
                      if str(env.get("FT_MAX_LEN")) != "256" or int(extra.get("max_length") or 0) != 256 or not str(m.get("commit", "")).startswith("20dca128"):
                          raise SystemExit(f"{tag} job{j}: length or commit differs")
                      if (tag == "t") != (env.get("FT_ROWCTX") == "1") or (extra.get("row_context") == SPEC) != (tag == "t") or (tag == "c" and extra.get("row_context") is not None):
                          raise SystemExit(f"{tag} job{j}: row context settings differ")
                      envs[f"{tag}{k}"] = {kk: v for kk, v in env.items() if kk not in ("FT_SEED", "FT_ROWCTX")}
                  for f, pre in PREFIX.items():
                      blob = subprocess.check_output(["git", "show", f"{m['commit']}:{f}"])
                      if not hashlib.sha256(blob).hexdigest().startswith(pre):
                          raise SystemExit(f"{tag} job{j}: {f} at the training commit differs from the preregistration")
                  out[f"{tag}_job{j}"] = {"sha256": got, "seed": seed, "commit": m.get("commit"), "FT_ROWCTX": env.get("FT_ROWCTX"), "max_length": extra.get("max_length")}
                  print(f"{tag} job{j} verified {got}")
          if len({json.dumps(v, sort_keys=True) for v in envs.values()}) != 1:
              raise SystemExit("control と T1 の設定が FT_SEED・FT_ROWCTX のほかで違う")
          Path("independent_eval/predictions_g4b").mkdir(parents=True, exist_ok=True)
          Path("independent_eval/predictions_g4b/weights_sha256.json").write_text(json.dumps(out, indent=1) + "\n", encoding="utf-8")
          PY

      - name: 予測（9 本、ラベルは読まない）と T1 の切り詰めの数え
        if: steps.gate.outputs.proceed == 'true'
        env: { TOKENIZERS_PARALLELISM: 'false' }
        run: |
          set -eu
          for j in 1 2 3; do
            python evaluate_independent.py predict --set independent_eval/results/g4b/g4b.json --checkpoint /tmp/ct-model/ft_out_job$j \
              --out independent_eval/predictions_g4b/pred_c_job$j.json --ledger independent_eval/predictions_g4b/ledger.jsonl --device cpu \
              --titles independent_eval/results/g4b/titles.json
          done
          for j in 4 5 6; do
            python evaluate_independent.py predict --set independent_eval/results/g4b/g4b.json --checkpoint /tmp/ct-model/ft_out_job$j \
              --out independent_eval/predictions_g4b/pred_t_job$j.json --ledger independent_eval/predictions_g4b/ledger.jsonl --device cpu \
              --titles independent_eval/results/g4b/titles.json
          done
          for j in 1 2 3; do
            python evaluate_independent.py predict --set independent_eval/results/g4b/g4b.json --checkpoint /tmp/l24-model/ft_out_job$j \
              --out independent_eval/predictions_g4b/pred_l24_job$j.json --ledger independent_eval/predictions_g4b/ledger.jsonl --device cpu \
              --titles independent_eval/results/g4b/titles.json
          done
          python research/g4b/g4b_tokens.py /tmp/ct-model/ft_out_job4 independent_eval/predictions_g4b/t1_tokens.json
          echo "done g4b-20261126-v1 (9 predictions)" > independent_eval/g4b_predict.request

      - name: 途中で失敗したときも予測・台帳・記録を残す（再実行の前に回収して理由を書く）
        if: failure() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g4b-predictions-partial
          path: independent_eval/predictions_g4b/
          retention-days: 30
          if-no-files-found: ignore

      - name: 予測と台帳だけを保存
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent_eval/predictions_g4b/ independent_eval/g4b_predict.request
          git commit -m "G4b の予測（control-256・T1-256・L24 各 3 本、自動、1 回だけ）"
          git pull --rebase origin main
          git push origin HEAD:main
