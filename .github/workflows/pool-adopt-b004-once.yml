name: Temporary b004 pool adoption

on:
  push:
    branches: [main]
    paths:
      - "materials/pool/adopt_b004.request"

permissions:
  contents: write

concurrency:
  group: jitsuris-pool-adopt-b004
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate request and run the existing deterministic adoption command
        run: |
          set -eu
          read -r cmd batch candidates <<< "$(head -n 1 materials/pool/adopt_b004.request)"
          test "$cmd" = "adopt"
          test "$batch" = "b004"
          test "$candidates" = "materials/pool/candidates_20261022.json"
          test ! -e "materials/pool/work/$batch/adopted.json"
          python -I materials/pipeline.py adopt --batch "$batch" --candidates "$candidates"
          echo "done $batch $candidates" > materials/pool/adopt_b004.request
      - name: Save the generated adoption record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/pool/work/b004/adopted.json materials/pool/adopt_b004.request
          git commit -m "教材庫 b004 の採用候補を決定"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
