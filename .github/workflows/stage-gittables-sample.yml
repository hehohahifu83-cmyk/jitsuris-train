name: GitTables小標本をラベル用シートにする

on:
  push:
    branches: [main]
    paths:
      - "materials/model_corpora/gittables_sample.request"

permissions:
  contents: write

concurrency:
  group: gittables-sample-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parquet readerを用意
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: 権利・重複・PIIを確認して小標本を抽出
        run: python -I materials/model_corpora/stage_gittables_sample.py

      - name: ラベル用シートと空の回答ファイルを作成
        run: |
          set -euo pipefail
          batch="$(python -c 'import json; print(json.load(open("materials/model_corpora/gittables_sample.request", encoding="utf-8"))["batch"])')"
          dir="materials/pool/work/$batch"
          python -I materials/corpus_to_set.py "$dir/corpus.jsonl" "$dir/set.json" "$batch"
          python -I materials/label_sheets.py make --batch "$batch"
          python - "$dir" <<'PY'
          import glob, json, os, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          meta = json.loads((d / "sheets/groups.json").read_text(encoding="utf-8"))
          by_sheet = {}
          for group in meta["groups"]:
              by_sheet.setdefault(group["sheet"], []).append(group["group"])
          for sheet, ids in by_sheet.items():
              path = d / "sheets" / "answers" / f"sheet_{sheet:03d}.tsv"
              path.write_text("".join(f"{gid}\\t\\n" for gid in ids), encoding="utf-8")
          report_path = d / "ingest_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          report.update({
              "status": "label_ready",
              "groups": len(meta["groups"]),
              "sheets": len(by_sheet),
              "label_guide": "LABEL_GUIDE.md v2.0",
              "answers_filled": 0,
              "next_action": "Fill sheets/answers/sheet_NNN.tsv independently; do not use GitTables weak labels as predictions.",
          })
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"{report['batch']}: {report['tables']} tables, {report['columns']} columns, {report['groups']} groups, {report['sheets']} sheets")
          PY

      - name: 作業ファイルを保存
        if: always()
        run: |
          set -euo pipefail
          batch="$(python -c 'import json; print(json.load(open("materials/model_corpora/gittables_sample.request", encoding="utf-8"))["batch"])')"
          printf 'done gittables %s\\n' "$batch" > materials/model_corpora/gittables_sample.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/model_corpora/gittables_sample.request
          if [ -d "materials/pool/work/$batch" ]; then git add "materials/pool/work/$batch"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GitTables小標本をラベル準備：$batch"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
