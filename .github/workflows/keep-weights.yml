name: 学習済みの重みを Kaggle の非公開データセットに残す

# Actions の artifact は 30 日で消えるので、残すと決めた重みを Kaggle の非公開データセットに写す（2026-10-25 オーナー指示「そうしてくれ」）。
# 依頼：kaggle/keep_weights.request に「keep」と書いて push。各 run の重みを SHA-256 で確かめてから上げる。終わったら done に戻す
on:
  push:
    branches: [main]
    paths: [kaggle/keep_weights.request]

permissions:
  actions: read
  contents: write

concurrency: { group: keep-weights, cancel-in-progress: false }

jobs:
  keep:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - run_id: "40118170559"
            slug: jitsuris-weights-c1-pool-40118170559
            title: jitsuris weights C1 pool 40118170559
            sha1: a7028e711568cfa9b8647b506838db7a353b5b7edf6c1ec8f131f6ac6ec89825
            sha2: 282a6e7f5edf13e414daff80df261161e97e2f01fea7dba5bc3007b26515bd73
            sha3: bf967eb40cec826cf11e784d99a7e5284c1651fefc52e04a05515d604a2f1873
          - run_id: "40202377192"
            slug: jitsuris-weights-c2-pool-title-40202377192
            title: jitsuris weights C2 pool title 40202377192
            sha1: 44404b339a9c3023d23f5bac67bdb81ad3aa64a16a95b3d7007f5e6f5b78fcf4
            sha2: 25fde28d6b2947bfa220bcb12b6718049ad40de39fd7ce2daf1a9bdddd50814d
            sha3: 9a347da089880ea7721ed564b578935823c1ce631323c4575234d26110092d38
          - run_id: "39506074807"
            slug: jitsuris-weights-v31-base-39506074807
            title: jitsuris weights v31 base 39506074807
            sha1: 38c5b3442a5825d3b46e484897e5cce2d5cabbf4dfc051722cfcfafa81187fb7
            sha2: 80c11790ccbae558d6b01e40975da739a000696b2693537bb75b5766cfd04b71
            sha3: 739dbc55dfe3c89acf5f91ec3d1ca8f83203148d77a0dea2c0c2012910b4fe70
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 依頼か確かめる
        id: gate
        run: |
          if grep -qx 'keep' kaggle/keep_weights.request; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "依頼なし"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.go == '1'
        with:
          name: jitsuris-model
          run-id: ${{ matrix.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/w
      - name: 重みの SHA-256 を確かめる
        if: steps.gate.outputs.go == '1'
        run: |
          for j in 1 2 3; do
            case $j in 1) want=${{ matrix.sha1 }};; 2) want=${{ matrix.sha2 }};; 3) want=${{ matrix.sha3 }};; esac
            got=$(sha256sum /tmp/w/ft_out_job$j/model.safetensors | cut -d' ' -f1)
            echo "job$j $got"; test "$got" = "$want"
          done
          du -sh /tmp/w
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with: { python-version: '3.12' }
      - name: Kaggle の非公開データセットに上げる
        if: steps.gate.outputs.go == '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          pip install -q kaggle
          DS="$KAGGLE_USERNAME/${{ matrix.slug }}"
          printf '{"title":"%s","id":"%s","licenses":[{"name":"other"}]}' "${{ matrix.title }}" "$DS" > /tmp/w/dataset-metadata.json
          if kaggle datasets status "$DS" >/dev/null 2>&1; then echo "もうある：$DS（上書きしない）"; exit 0; fi
          kaggle datasets create -p /tmp/w --dir-mode zip   # --public を付けない＝非公開
          for i in $(seq 1 60); do s=$(kaggle datasets status "$DS" 2>&1 || true); echo "$s"; [ "$s" = ready ] && break; sleep 30; done
          kaggle datasets files "$DS" | tee /tmp/files.txt
          grep -c ft_out_job /tmp/files.txt
      - name: 記録
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          echo "$(date -u +%FT%TZ) 重みを非公開データセット ${{ matrix.slug }} に残した（run ${{ matrix.run_id }}、SHA-256 照合済み）" >> kaggle/KAGGLE_LOG.md
          git add kaggle/KAGGLE_LOG.md && git commit -m "重みを Kaggle の非公開データセットに残した（run ${{ matrix.run_id }}）" && git pull --rebase --autostash origin main && git push origin HEAD:main

  finish:
    needs: keep
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          echo "done ${{ needs.keep.result }}" > kaggle/keep_weights.request
          git add kaggle/keep_weights.request && git commit -m "重みを残す依頼：${{ needs.keep.result }}" && git pull --rebase --autostash origin main && git push origin HEAD:main || true
