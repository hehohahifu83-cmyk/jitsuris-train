name: 上位モデルの学習データを取る（権利の表示がはっきりしたものだけ）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "materials/model_corpora/fetch.request"

permissions:
  contents: write

concurrency:
  group: model-corpora-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 道具
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: 依頼を読む（1 行に 1 つ。inspect <名前> または convert <名前>）
        id: req
        run: |
          if head -1 materials/model_corpora/fetch.request | grep -q '^done'; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - name: 実行
        if: steps.req.outputs.proceed == 'true'
        env: { CORPUS_WORK: /tmp/corpora }
        run: |
          set -u
          status=0
          while read -r cmd name; do
            [ -z "$cmd" ] && continue
            case "$cmd" in
              inspect) python -I materials/model_corpora/fetch_corpus.py inspect "$name" "materials/model_corpora/inspect/$name.md" || status=1 ;;
              convert) python -I materials/model_corpora/fetch_corpus.py convert "$name" "materials/model_corpora/data/$name" || status=1 ;;
              *) echo "知らない命令：$cmd"; status=1 ;;
            esac
            rm -rf /tmp/corpora/"$name"
          done < materials/model_corpora/fetch.request
          echo "status=$status" >> "$GITHUB_ENV"
      - name: 保存
        if: always() && steps.req.outputs.proceed == 'true'
        run: |
          { echo "done $(date -u +%Y-%m-%dT%H:%MZ) status=${status:-1}"; cat materials/model_corpora/fetch.request; } > /tmp/req && mv /tmp/req materials/model_corpora/fetch.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/model_corpora/fetch.request
          [ -d materials/model_corpora/inspect ] && git add materials/model_corpora/inspect
          [ -d materials/model_corpora/data ] && git add materials/model_corpora/data
          git commit -m "上位モデルの学習データ：取得・点検（自動）" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
