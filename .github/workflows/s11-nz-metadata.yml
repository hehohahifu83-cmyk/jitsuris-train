name: S11 3.4 New Zealand catalogue metadata discovery

on:
  push:
    branches: [main]
    paths:
      - "materials/s11_3_4_nz_discovery.request"

permissions:
  contents: write

concurrency:
  group: s11-3-4-nz-metadata-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自己テスト
        run: python -I materials/s11_3_4_discover_nz.py --self-test
      - name: 依頼を検査
        id: request
        run: |
          set -euo pipefail
          read -r command run_date < materials/s11_3_4_nz_discovery.request
          if [[ "$command" == "done" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$command" == "register" || "$command" == "discover" ]]
          [[ "$run_date" =~ ^2026[0-9]{4}(-v[0-9]+)?$ ]]
          echo "execute=true" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
      - name: ニュージーランド公開元を先に登録（データセット照会なし）
        if: steps.request.outputs.execute == 'true' && steps.request.outputs.command == 'register'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: python -I materials/s11_3_4_discover_nz.py --mode register --run-date "$RUN_DATE"
      - name: train 公開元だけのメタデータを探索
        if: steps.request.outputs.execute == 'true' && steps.request.outputs.command == 'discover'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: python -I materials/s11_3_4_discover_nz.py --mode discover --run-date "$RUN_DATE"
      - name: 結果と完了状態を保存
        if: steps.request.outputs.execute == 'true'
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          echo "done $COMMAND $RUN_DATE" > materials/s11_3_4_nz_discovery.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/s11_3_4_discover_nz.py materials/s11_3_4_nz_discovery.request
          if [[ "$COMMAND" == "register" ]]; then
            git add independent_eval/allocation.json
            git add independent_eval/allocation_sources_20261022.json
            git add "materials/s11_3_4_nz_registration_${RUN_DATE}.json"
            git commit -m "S11 3.4 ニュージーランド公開元を登録"
          else
            git add "materials/s11_3_4_nz_candidates_${RUN_DATE}.json"
            git add "materials/s11_3_4_nz_candidates_${RUN_DATE}.md"
            git commit -m "S11 3.4 ニュージーランド候補を探索"
          fi
          git pull --rebase --autostash origin main
          git push origin HEAD:main
