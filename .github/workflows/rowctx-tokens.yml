name: 方法 T1 の入力のトークンでの残り方（教材庫の検証の行だけ、CPU）

# 2026-11-17 Claude（Codex の点検 3）。research/table_reading/rowctx_tokens.py を、L24 と同じトークナイザー（intfloat/multilingual-e5-base の同じ版）で回す。
# 依頼：research/table_reading/rowctx_tokens.request を「run rowctx-tokens-v2」にして push する。学習・予測・G4 は使わない。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/table_reading/rowctx_tokens.request'

permissions:
  contents: write

concurrency:
  group: rowctx-tokens
  cancel-in-progress: false

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 依頼を確かめる
        id: gate
        run: |
          if [ "$(head -1 research/table_reading/rowctx_tokens.request)" != "run rowctx-tokens-v2" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with: { python-version: '3.11' }
      - name: 道具（予測と同じ版）
        if: steps.gate.outputs.proceed == 'true'
        run: python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' sentencepiece
      - name: 数える
        if: steps.gate.outputs.proceed == 'true'
        run: python research/table_reading/rowctx_tokens.py intfloat/multilingual-e5-base d128750597153bb5987e10b1c3493a34e5a4502a
      - name: 結果だけを保存
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "done rowctx-tokens-v2" > research/table_reading/rowctx_tokens.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/table_reading/rowctx_tokens.json research/table_reading/rowctx_tokens.request
          git commit -m "方法 T1 の入力のトークンでの残り方（自動）"
          git pull --rebase origin main
          git push origin HEAD:main
