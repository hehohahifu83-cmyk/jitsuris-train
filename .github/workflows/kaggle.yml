name: Kaggle の GPU で学習
on:
  push:
    branches: [main]
    paths: [kaggle/kaggle.request]
  schedule:
    - cron: '*/10 * * * *'   # 10分ごとに状態と結果回収を確認
permissions:
  contents: write
concurrency: { group: kaggle, cancel-in-progress: false }
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install kaggle
      - name: 回収する用事があるか（定期実行のとき）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if grep -qE '^(train|fetch)' kaggle/kaggle.request && ! grep -q '^done' kaggle/kaggle.request; then
              echo "mode=fetch" >> $GITHUB_OUTPUT
            elif grep -qx 'done' kaggle/kaggle.request; then
              echo "mode=status" >> $GITHUB_OUTPUT
              echo "status_only=1" >> $GITHUB_OUTPUT
            else
              echo "skip=1" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Kaggle
        if: steps.gate.outputs.skip != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          STATUS_ONLY: ${{ steps.gate.outputs.status_only }}
          WAIT_MIN: '280'
          PROGRESS_PUSH: '1'
          QUEUE_MAX: '20'   # Kaggle の GPU 割当待ちは別の定期チェックで続ける
        run: |
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          if [ "${{ steps.gate.outputs.mode }}" = fetch ]; then
            cp kaggle/kaggle.request /tmp/req && echo fetch > kaggle/kaggle.request && WAIT_MIN=1 bash kaggle/kaggle.sh
          elif [ "${{ steps.gate.outputs.mode }}" = status ]; then
            st=$(kaggle kernels status "$KAGGLE_USERNAME/jitsuris-train" 2>&1 || true)
            echo "$(date -u +%FT%TZ) 状態確認（定期）：$st" >> kaggle/KAGGLE_LOG.md
          else
            bash kaggle/kaggle.sh
          fi
      - uses: actions/upload-artifact@v4
        id: model_artifact
        if: steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        with: { name: jitsuris-model, path: /tmp/model, retention-days: 30, if-no-files-found: ignore }
      - name: Evidence-first error analysis
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        run: |
          mkdir -p /tmp/eval_reports
          python cpu_lab/error_analysis.py /tmp/eval_reports --out /tmp/eval_reports/ERROR_ANALYSIS.md
          cat /tmp/eval_reports/ERROR_ANALYSIS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: eval_artifact
        if: steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        with: { name: jitsuris-evaluation-reports, path: /tmp/eval_reports, retention-days: 30, if-no-files-found: ignore }
      - name: Record separate training and recovery states
        if: always() && steps.gate.outputs.skip != '1'
        env:
          MODEL_ARTIFACT_ID: ${{ steps.model_artifact.outputs['artifact-id'] }}
          EVAL_ARTIFACT_ID: ${{ steps.eval_artifact.outputs['artifact-id'] }}
          ACTION_RUN_ID: ${{ github.run_id }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          request = Path("kaggle/kaggle.request").read_text(encoding="utf-8").strip()
          log = Path("kaggle/KAGGLE_LOG.md").read_text(encoding="utf-8")
          import re
          state_lines = [line for line in log.splitlines() if "KernelWorkerStatus." in line]
          latest = state_lines[-1] if state_lines else "Kaggle kernel status: no status recorded"
          match = re.search(r"KernelWorkerStatus\.([A-Z_]+)", latest)
          raw_state = match.group(1) if match else "UNKNOWN"
          state_times = [re.match(r"^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ)", line) for line in state_lines]
          observed_at = next((m.group(1) for m in reversed(state_times) if m), "時刻記録なし")
          changed = subprocess.run(["git", "diff", "--quiet", "--", "FINETUNE_RESULTS.md"]).returncode != 0
          report_count = sum(1 for p in Path("/tmp/eval_reports").glob("*") if p.is_file())
          model_id = os.environ.get("MODEL_ARTIFACT_ID", "").strip()
          eval_id = os.environ.get("EVAL_ARTIFACT_ID", "").strip()
          previous_status = Path("kaggle/STATUS.md").read_text(encoding="utf-8") if Path("kaggle/STATUS.md").exists() else ""
          def previous_value(prefixes):
              for line in previous_status.splitlines():
                  for prefix in prefixes:
                      if line.startswith(prefix):
                          return line.split(":", 1)[1].strip()
              return ""
          training_map = {
              "QUEUED": "待機中（Kaggle GPU の割当待ち）",
              "RUNNING": "実行中（Kaggle が RUNNING を返答）",
              "COMPLETE": "学習完了（Kaggle が COMPLETE を返答）",
              "ERROR": "失敗（Kaggle が ERROR を返答）",
              "CANCELED": "キャンセル（Kaggle が CANCELED を返答）",
              "CANCELLED": "キャンセル（Kaggle が CANCELLED を返答）",
          }
          training = training_map.get(raw_state, "未確認（Kaggle の状態を取得できていない）")
          if raw_state == "UNKNOWN" and request == "done":
              training = "最新の Kaggle 状態記録なし（done だけでは完了と判定しない）"
          results = "今回の実行で FINETUNE_RESULTS.md を更新" if changed else "今回の更新なし（過去結果とは区別）"
          checkpoint = f"回収 artifact ID {model_id}" if model_id else "artifact 未確認／未作成"
          eval_artifact = f"回収 artifact ID {eval_id}（{report_count}ファイル）" if eval_id else f"artifact 未確認／未作成（今回の検出JSON {report_count}件）"
          if os.environ.get("STATUS_ONLY") == "1":
              results = previous_value(["- 評価結果回収:", "- 評価結果:"]) or results
              checkpoint = previous_value(["- 学習済みモデル回収:", "- 学習済みモデルartifact:"]) or checkpoint
              eval_artifact = previous_value(["- 評価レポートartifact:"]) or eval_artifact
          body = textwrap.dedent(f"""
          # 最新の学習・結果回収状況
          
          - GitHub Actions run: [{os.environ['ACTION_RUN_ID']}]({os.environ['ACTION_RUN_URL']})
          - 確認更新時刻 (UTC): {__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(timespec='seconds')}
          - 依頼ファイル: `{request}`
          - Kaggle学習状態: {training}
          - Kaggle状態の最終観測時刻 (UTC): {observed_at}
          - Kaggle状態の根拠ログ: `{latest}`
          - 評価結果回収: {results}
          - 評価レポートartifact: {eval_artifact}
          - 学習済みモデル回収: {checkpoint}
          - 判定手順: [STATUS_GUIDE.md](STATUS_GUIDE.md)
          
          学習の開始はKaggleのRUNNING、学習完了はCOMPLETEで確認する。評価結果とモデルは別々に回収確認する。`kaggle.request=done`だけではモデルcheckpointが保存されたことを意味しない。
          """).lstrip()
          Path("kaggle/STATUS.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(body + "\n")
          PY
      - name: Save
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in FINETUNE_RESULTS.md kaggle/PROGRESS.md kaggle/STATUS.md kaggle/KAGGLE_LOG.md kaggle/kaggle.request kaggle/last_run_tail.txt; do [ -e "$f" ] && git add "$f"; done; true
          if [ -s /tmp/eval_reports/ERROR_ANALYSIS.md ]; then mkdir -p cpu_lab/reports; cp /tmp/eval_reports/ERROR_ANALYSIS.md "cpu_lab/reports/error-analysis-run-${GITHUB_RUN_ID}.md"; git add "cpu_lab/reports/error-analysis-run-${GITHUB_RUN_ID}.md"; fi
          # 確率（列名・正解・予測・上位3つの確率だけ。列の値は入らない）のうち『微調整だけ』と『7割＋3割』を、読めるようにリポジトリにも置く（最新の1回分。全部は artifact に30日）。誤りの一覧は確率から作れる
          if ls /tmp/eval_reports/*.json >/dev/null 2>&1; then rm -rf eval_reports/latest; mkdir -p eval_reports/latest; cp /tmp/eval_reports/*_probs_*_ft.json /tmp/eval_reports/*_probs_*_blend70.json eval_reports/latest/ 2>/dev/null || true; git add eval_reports; fi
          git diff --cached --quiet && exit 0
          git commit -m "Kaggle の GPU での学習（状態・集計）"
          for i in 1 2 3; do git push && break; git pull --rebase; done

