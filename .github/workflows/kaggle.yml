name: Kaggle の GPU で学習
on:
  push:
    branches: [main]
    paths: [kaggle/kaggle.request]
  schedule:
    - cron: '*/10 * * * *'   # 10分ごとに状態と結果回収を確認
permissions:
  contents: write
concurrency: { group: kaggle, cancel-in-progress: false }
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test Kaggle lifecycle monitor
        run: python -m unittest discover -s tests -p 'test_kaggle_monitor.py'
      - name: Test evaluation artifact integrity
        run: python -m unittest tests.test_eval_artifact_integrity
      - name: Capture previously submitted training cycle
        id: previous_cycle
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from kaggle_monitor import latest_training_cycle
          print(f"cycle={latest_training_cycle(Path('kaggle/KAGGLE_LOG.md').read_text(encoding='utf-8'))}")
          PY
      - run: pip install kaggle
      - name: 回収する用事があるか（定期実行のとき）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if grep -qE '^(train|fetch)' kaggle/kaggle.request && ! grep -q '^done' kaggle/kaggle.request; then
              echo "mode=fetch" >> $GITHUB_OUTPUT
            elif grep -qx 'done' kaggle/kaggle.request; then
              echo "mode=status" >> $GITHUB_OUTPUT
              echo "status_only=1" >> $GITHUB_OUTPUT
            else
              echo "skip=1" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Kaggle
        if: steps.gate.outputs.skip != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          STATUS_ONLY: ${{ steps.gate.outputs.status_only }}
          WAIT_MIN: '280'
          PROGRESS_PUSH: '1'
          QUEUE_MAX: '20'   # Kaggle の GPU 割当待ちは別の定期チェックで続ける
        run: |
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          if [ "${{ steps.gate.outputs.mode }}" = fetch ]; then
            cp kaggle/kaggle.request /tmp/req && echo fetch > kaggle/kaggle.request && WAIT_MIN=1 bash kaggle/kaggle.sh
          elif [ "${{ steps.gate.outputs.mode }}" = status ]; then
            st=$(kaggle kernels status "$KAGGLE_USERNAME/jitsuris-train" 2>&1 || true)
            echo "$(date -u +%FT%TZ) 状態確認（定期）：$st" >> kaggle/KAGGLE_LOG.md
          else
            bash kaggle/kaggle.sh
          fi
      - name: Validate evaluation artifacts
        # auto＝仕事1・2が種子1・2で開発用220 を評価した従来の対の設計なら、従来どおり全部揃っているかまで確かめる。それ以外（検証モード・種子3つ・学習率の探索）は、存在する (仕事, 試験) ごとに全条件が揃っているかと、1 ファイルごとの検査。
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        run: python cpu_lab/eval_artifact_integrity.py /tmp/eval_reports --conditions sparse,ft,blend50,blend60,blend70 --layout auto
      - uses: actions/upload-artifact@v4
        id: model_artifact
        # 検査が失敗しても、持ち帰ったモデルと結果は残す（証拠を捨てない）。失敗は上の検査の赤で見える
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        with: { name: jitsuris-model, path: /tmp/model, retention-days: 30, if-no-files-found: ignore }
      - name: Evidence-first error analysis
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        run: |
          mkdir -p /tmp/eval_reports
          python cpu_lab/error_analysis.py /tmp/eval_reports --out /tmp/eval_reports/ERROR_ANALYSIS.md
          cat /tmp/eval_reports/ERROR_ANALYSIS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare audited replay with matched baselines
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        run: |
          files=(/tmp/eval_reports/job1_progress_probe_after.json /tmp/eval_reports/job2_progress_probe_after.json /tmp/eval_reports/job3_progress_probe_after.json /tmp/eval_reports/job4_progress_probe_after.json)
          if [ -f "${files[0]}" ] && [ -f "${files[1]}" ] && [ -f "${files[2]}" ] && [ -f "${files[3]}" ]; then
            python cpu_lab/compare_replay_probe.py --baseline "${files[0]}" "${files[1]}" --replay "${files[2]}" "${files[3]}" --out /tmp/eval_reports/REPLAY_PROBE_COMPARISON.json
            cat /tmp/eval_reports/REPLAY_PROBE_COMPARISON.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "4条件の学習後probeが揃わないため、比較は未実施。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        id: eval_artifact
        if: always() && steps.gate.outputs.skip != '1' && steps.gate.outputs.mode != 'status'
        with: { name: jitsuris-evaluation-reports, path: /tmp/eval_reports, retention-days: 30, if-no-files-found: ignore }
      - name: Observe Kaggle state after this run
        id: live_status
        if: always() && steps.gate.outputs.skip != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set +e
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          raw=$(kaggle kernels status "$KAGGLE_USERNAME/jitsuris-train" 2>&1)
          rc=$?
          observed_at=$(date -u +%FT%TZ)
          delimiter="KAGGLE_STATUS_$(date +%s)_$RANDOM"
          {
            echo "raw<<$delimiter"
            printf '%s\n' "$raw"
            echo "$delimiter"
            echo "returncode=$rc"
            echo "observed_at=$observed_at"
          } >> "$GITHUB_OUTPUT"
          echo "Fresh Kaggle status: $raw"
      - name: Record separate training and recovery states
        if: always() && steps.gate.outputs.skip != '1'
        env:
          MODEL_ARTIFACT_ID: ${{ steps.model_artifact.outputs['artifact-id'] }}
          EVAL_ARTIFACT_ID: ${{ steps.eval_artifact.outputs['artifact-id'] }}
          ACTION_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_CYCLE: ${{ steps.previous_cycle.outputs.cycle }}
          ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OBSERVED_RAW: ${{ steps.live_status.outputs.raw }}
          OBSERVED_RETURN_CODE: ${{ steps.live_status.outputs.returncode }}
          OBSERVED_AT: ${{ steps.live_status.outputs.observed_at }}
        run: |
          python - <<'PY'
          import os, subprocess, textwrap
          from pathlib import Path
          from kaggle_monitor import latest_training_cycle, parse_status, render_progress, update_monitor
          request = Path("kaggle/kaggle.request").read_text(encoding="utf-8").strip()
          log = Path("kaggle/KAGGLE_LOG.md").read_text(encoding="utf-8")
          latest = " ".join(os.environ.get("OBSERVED_RAW", "").split())[:500]
          raw_state = parse_status(latest, int(os.environ.get("OBSERVED_RETURN_CODE", "1") or "1"))
          observed_at = os.environ.get("OBSERVED_AT", "").strip() or "時刻記録なし"
          cycle_id = latest_training_cycle(log)
          new_train_push = os.environ.get("EVENT_NAME") == "push" and request.startswith("train ")
          previous_cycle = os.environ.get("PREVIOUS_CYCLE", "").strip()
          if new_train_push and cycle_id == previous_cycle:
              # A prior Kaggle COMPLETE may be returned even when this request failed before push.
              raw_state = "UNKNOWN"
              cycle_id = f"unsubmitted-{os.environ['ACTION_RUN_ID']}"
              latest = "今回の依頼はKaggleへのpush記録がないため、以前のKaggle状態を結び付けず未確認"
          elif not latest:
              latest = "今回のKaggle状態取得に失敗（前回状態を流用せず未確認）"
          changed = subprocess.run(["git", "diff", "--quiet", "--", "FINETUNE_RESULTS.md"]).returncode != 0
          report_count = sum(1 for p in Path("/tmp/eval_reports").glob("*") if p.is_file())
          model_id = os.environ.get("MODEL_ARTIFACT_ID", "").strip()
          eval_id = os.environ.get("EVAL_ARTIFACT_ID", "").strip()
          execution_evidence = []
          if raw_state == "COMPLETE":
              if changed:
                  execution_evidence.append("Kaggle COMPLETE and FINETUNE_RESULTS.md updated in this recovery run")
              if model_id:
                  execution_evidence.append(f"Kaggle model artifact {model_id} created")
              if eval_id:
                  execution_evidence.append(f"Kaggle evaluation artifact {eval_id} created")
          monitor = update_monitor(
              "kaggle/MONITOR.json", cycle_id=cycle_id, observed_at=observed_at,
              state=raw_state, raw=latest, action_run_id=os.environ["ACTION_RUN_ID"],
              execution_evidence=execution_evidence)
          Path("kaggle/PROGRESS.md").write_text(render_progress(
              state=raw_state, observed_at=observed_at, raw=latest, cycle_id=cycle_id,
              action_run_id=os.environ["ACTION_RUN_ID"]), encoding="utf-8")
          previous_status = Path("kaggle/STATUS.md").read_text(encoding="utf-8") if Path("kaggle/STATUS.md").exists() else ""
          def previous_value(prefixes):
              for line in previous_status.splitlines():
                  for prefix in prefixes:
                      if line.startswith(prefix):
                          return line.split(":", 1)[1].strip()
              return ""
          training_map = {
              "QUEUED": "待機中（Kaggle GPU の割当待ち）",
              "RUNNING": "実行中（Kaggle が RUNNING を返答）",
              "COMPLETE": "学習完了（Kaggle が COMPLETE を返答）",
              "ERROR": "失敗（Kaggle が ERROR を返答）",
              "CANCELED": "キャンセル（Kaggle が CANCELED を返答）",
              "CANCELLED": "キャンセル（Kaggle が CANCELLED を返答）",
          }
          training = training_map.get(raw_state, "未確認（Kaggle の状態を取得できていない）")
          if raw_state == "UNKNOWN" and request == "done":
              training = "最新の Kaggle 状態記録なし（done だけでは完了と判定しない）"
          results = "今回の実行で FINETUNE_RESULTS.md を更新" if changed else "今回の更新なし（過去結果とは区別）"
          checkpoint = f"回収 artifact ID {model_id}" if model_id else "artifact 未確認／未作成"
          eval_artifact = f"回収 artifact ID {eval_id}（{report_count}ファイル）" if eval_id else f"artifact 未確認／未作成（今回の検出JSON {report_count}件）"
          if os.environ.get("STATUS_ONLY") == "1":
              results = previous_value(["- 評価結果回収:", "- 評価結果:"]) or results
              checkpoint = previous_value(["- 学習済みモデル回収:", "- 学習済みモデルartifact:"]) or checkpoint
              eval_artifact = previous_value(["- 評価レポートartifact:"]) or eval_artifact
          body = textwrap.dedent(f"""
          # 最新の学習・結果回収状況
          
          - GitHub Actions run: [{os.environ['ACTION_RUN_ID']}]({os.environ['ACTION_RUN_URL']})
          - 確認更新時刻 (UTC): {__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(timespec='seconds')}
          - 依頼ファイル: `{request}`
          - Kaggle学習状態: {training}
          - Kaggle状態の最終観測時刻 (UTC): {observed_at}
          - Kaggle状態の根拠ログ: `{latest}`
          - 学習依頼ID: `{cycle_id or "未特定"}`
          - Kaggleでの開始を観測した時刻 (UTC): {monitor.get("first_running_at") or "未観測"}
          - Kaggleでの完了を観測した時刻 (UTC): {monitor.get("first_complete_at") or "未観測"}
          - 実学習の実行確認: {("確認済み（Kaggle結果・artifactを回収）" if monitor.get("training_execution_confirmed") else "未確認")}
          - 評価結果回収: {results}
          - 評価レポートartifact: {eval_artifact}
          - 学習済みモデル回収: {checkpoint}
          - 判定手順: [STATUS_GUIDE.md](STATUS_GUIDE.md)
          
          学習の開始はKaggleのRUNNING、学習完了はCOMPLETEで確認する。評価結果とモデルは別々に回収確認する。`kaggle.request=done`だけではモデルcheckpointが保存されたことを意味しない。
          """).lstrip()
          Path("kaggle/STATUS.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(body + "\n")
          PY
      - name: Save
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in FINETUNE_RESULTS.md kaggle/PROGRESS.md kaggle/STATUS.md kaggle/MONITOR.json kaggle/KAGGLE_LOG.md kaggle/kaggle.request kaggle/last_run_tail.txt; do [ -e "$f" ] && git add "$f"; done; true
          if [ -s /tmp/eval_reports/ERROR_ANALYSIS.md ]; then mkdir -p cpu_lab/reports; cp /tmp/eval_reports/ERROR_ANALYSIS.md "cpu_lab/reports/error-analysis-run-${GITHUB_RUN_ID}.md"; git add "cpu_lab/reports/error-analysis-run-${GITHUB_RUN_ID}.md"; fi
          # 確率（列名・正解・予測・上位3つの確率だけ。列の値は入らない）のうち『微調整だけ』と『7割＋3割』を、読めるようにリポジトリにも置く（最新の1回分。全部は artifact に30日）。誤りの一覧は確率から作れる
          if ls /tmp/eval_reports/*.json >/dev/null 2>&1; then
            rm -rf eval_reports/latest; mkdir -p eval_reports/latest
            cp /tmp/eval_reports/*_probs_*_ft.json /tmp/eval_reports/*_probs_*_blend70.json /tmp/eval_reports/*_manifest.json eval_reports/latest/ 2>/dev/null || true
            # 回収した実行ごとに残す（latest は次の回収で置き換わる）。この番号が browser_test/run.request の kaggle_run と同じ番号
            mkdir -p "eval_reports/runs/${GITHUB_RUN_ID}"; cp eval_reports/latest/* "eval_reports/runs/${GITHUB_RUN_ID}/" 2>/dev/null || true
            git add eval_reports
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Kaggle の GPU での学習（状態・集計）"
          for i in 1 2 3; do git push && break; git pull --rebase; done

