name: Kaggle の GPU で学習
on:
  push:
    branches: [main]
    paths: [kaggle/kaggle.request]
  schedule:
    - cron: '7,37 * * * *'   # 30分ごとに、待っている学習が終わったか確かめて結果を回収する（公開リポジトリなので無料）
permissions:
  contents: write
concurrency: { group: kaggle, cancel-in-progress: false }
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install kaggle
      - name: 回収する用事があるか（定期実行のとき）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if grep -qE '^(train|fetch)' kaggle/kaggle.request && ! grep -q '^done' kaggle/kaggle.request; then echo "mode=fetch" >> $GITHUB_OUTPUT; else echo "skip=1" >> $GITHUB_OUTPUT; fi
          fi
      - name: Kaggle
        if: steps.gate.outputs.skip != '1'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          WAIT_MIN: '280'
          PROGRESS_PUSH: '1'
          QUEUE_MAX: '20'   # 公開リポジトリは実行時間が無料なので、終わるまで待って結果を持ち帰る
        run: |
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          if [ "${{ steps.gate.outputs.mode }}" = fetch ]; then cp kaggle/kaggle.request /tmp/req && echo fetch > kaggle/kaggle.request && WAIT_MIN=1 bash kaggle/kaggle.sh; else bash kaggle/kaggle.sh; fi
      - uses: actions/upload-artifact@v4
        with: { name: jitsuris-model, path: /tmp/model, retention-days: 30, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: jitsuris-evaluation-reports, path: /tmp/eval_reports, retention-days: 30, if-no-files-found: ignore }
      - name: Save
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in FINETUNE_RESULTS.md kaggle/PROGRESS.md kaggle/KAGGLE_LOG.md kaggle/kaggle.request kaggle/last_run_tail.txt; do [ -e "$f" ] && git add "$f"; done; true
          # 誤りの一覧と確率（列名・正解・予測・上位3つの確率だけ。列の値は入らない）を、読めるようにリポジトリにも置く（最新の1回分）
          if ls /tmp/eval_reports/*.json >/dev/null 2>&1; then rm -rf eval_reports/latest; mkdir -p eval_reports/latest; cp /tmp/eval_reports/*.json eval_reports/latest/; git add eval_reports; fi
          git diff --cached --quiet && exit 0
          git commit -m "Kaggle の GPU での学習（状態・集計）"
          for i in 1 2 3; do git push && break; git pull --rebase; done

