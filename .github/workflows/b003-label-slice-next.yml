name: Temporary b003 label slice next
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b003-label-slice-next.yml"
permissions:
  contents: write
jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create requested corpus slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("materials/pool/work/b003/corpus.jsonl").read_text(encoding="utf-8").splitlines(keepends=True)
          chunk = lines[4309:4412]
          if len(chunk) != 103:
              raise SystemExit(f"expected 103 rows, got {len(chunk)}")
          for n, line in enumerate(chunk, 4310):
              json.loads(line)
          target = Path("materials/pool/work/b003/label_slice_4310_4412.tmp.jsonl")
          target.write_text("".join(chunk), encoding="utf-8")
          print(f"created {target}: {len(chunk)} rows")
          PY
      - name: Save temporary slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/pool/work/b003/label_slice_4310_4412.tmp.jsonl
          git commit -m "Temporary b003 label slice"
          git push origin HEAD:main
