name: F1 の予測（L・L24 各 3 本、CPU、1 回だけ）

# 2026-11-10 Claude。事前記録 bench/g24fix_prereg_20261104.md・bench/fixj_prereg_20261109.md。
# 正解（非公開の ai-bridge labels/f1/final.jsonl、SHA dfc983a8…）を固定したあとに 1 回だけ回す。ラベルは読まない。
# 依頼：independent_eval/f1_predict.request を「run f1-20261109-v1 once」にして push する。
# L  ＝ D2 run 41192849082 の ft_out_job2〜4（FT_LABELFIX=labelfix_v24 だけ、種子 1〜3）
# L24＝ run 41735353926 の ft_out_job1〜3（FT_LABELFIX=4 ファイル、種子 1〜3）。学習の commit の 4 ファイルの SHA を事前記録と照合する
#      （同じ入力・同じ道具での数え直しが 1,492 行、事前記録 2026-11-05 の追記）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'independent_eval/f1_predict.request'

permissions:
  actions: read
  contents: write

concurrency:
  group: f1-20261109-v1-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 1 回だけの依頼と凍結のセットを確かめる
        id: gate
        run: |
          if [ "$(head -1 independent_eval/f1_predict.request)" != "run f1-20261109-v1 once" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ls independent_eval/predictions_f1/pred_*.json >/dev/null 2>&1; then echo "予測がもうある（1 回だけ）"; exit 1; fi
          echo "e660d46aba65fef87b5a725ac7ef0a2338f37ac89738a7ff9c74177e3507b0d9  independent_eval/results/f1/f1.json" | sha256sum -c -
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with: { python-version: '3.11' }

      - name: CPU の推論の道具（ラベルの手伝いの予測と同じ版）
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' 'safetensors==0.8.0' sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 41192849082
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l-model

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 41735353926
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/l24-model

      - name: 重みと学習の設定を事前記録と照合する
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          V24 = "materials/pool/labelfix_v24.jsonl"
          FOUR = "materials/pool/labelfix_v24.jsonl,materials/pool/labelfix_g24_b3.jsonl,materials/pool/labelfix_g24_sheet.jsonl,materials/pool/labelfix_g24_pool.jsonl"
          PREFIX = {"materials/pool/labelfix_v24.jsonl": "38271e8b446e", "materials/pool/labelfix_g24_b3.jsonl": "a9967e38e721",
                    "materials/pool/labelfix_g24_sheet.jsonl": "cf872de25a6c", "materials/pool/labelfix_g24_pool.jsonl": "d39ef5880713"}
          out = {}
          for tag, root, jobs, fix in (("l", "/tmp/l-model", (2, 3, 4), V24), ("l24", "/tmp/l24-model", (1, 2, 3), FOUR)):
              for k, j in enumerate(jobs, 1):
                  ck = Path(root) / f"ft_out_job{j}"
                  m = json.loads((ck / "manifest.json").read_text(encoding="utf-8"))
                  name, meta = next(iter(m["saved_model"]["weights"].items()))
                  got = hashlib.sha256((ck / name).read_bytes()).hexdigest()
                  env = (m.get("run") or {}).get("env") or {}
                  seed = str((m.get("run") or {}).get("seed"))
                  if got != meta["sha256"]:
                      raise SystemExit(f"{tag} job{j}: weight verification failed")
                  if env.get("FT_LABELFIX") != fix or env.get("FT_VALUEFIX") or str(env.get("FT_TITLE")) != "1" or seed != str(k):
                      raise SystemExit(f"{tag} job{j}: settings do not match the preregistration")
                  if tag == "l24":
                      for f, pre in PREFIX.items():
                          blob = subprocess.check_output(["git", "show", f"{m['commit']}:{f}"])
                          if not hashlib.sha256(blob).hexdigest().startswith(pre):
                              raise SystemExit(f"l24 job{j}: {f} at the training commit differs from the preregistration")
                  out[f"{tag}_job{j}"] = {"sha256": got, "seed": seed, "commit": m.get("commit"), "FT_LABELFIX": env.get("FT_LABELFIX"), "FT_TITLE": env.get("FT_TITLE")}
                  print(f"{tag} job{j} verified {got}")
          Path("independent_eval/predictions_f1").mkdir(parents=True, exist_ok=True)
          Path("independent_eval/predictions_f1/weights_sha256.json").write_text(json.dumps(out, indent=1) + "\n", encoding="utf-8")
          PY

      - name: 予測（6 本、ラベルは読まない）
        if: steps.gate.outputs.proceed == 'true'
        env: { TOKENIZERS_PARALLELISM: 'false' }
        run: |
          set -eu
          for j in 2 3 4; do
            python evaluate_independent.py predict --set independent_eval/results/f1/f1.json --checkpoint /tmp/l-model/ft_out_job$j \
              --out independent_eval/predictions_f1/pred_l_job$j.json --ledger independent_eval/predictions_f1/ledger.jsonl --device cpu \
              --titles independent_eval/results/f1/titles.json
          done
          for j in 1 2 3; do
            python evaluate_independent.py predict --set independent_eval/results/f1/f1.json --checkpoint /tmp/l24-model/ft_out_job$j \
              --out independent_eval/predictions_f1/pred_l24_job$j.json --ledger independent_eval/predictions_f1/ledger.jsonl --device cpu \
              --titles independent_eval/results/f1/titles.json
          done
          echo "done f1-20261109-v1 (6 predictions)" > independent_eval/f1_predict.request

      - name: 予測と台帳だけを保存
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent_eval/predictions_f1/ independent_eval/f1_predict.request
          git commit -m "F1 の予測（L・L24 各 3 本、自動、1 回だけ）"
          git pull --rebase origin main
          git push origin HEAD:main
