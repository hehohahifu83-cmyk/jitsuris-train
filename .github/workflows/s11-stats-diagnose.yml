name: S11 3.3 BODIK検索条件の診断

on:
  push:
    branches: [main]
    paths:
      - "materials/s11_3_3_diagnose.request"

permissions:
  contents: write

concurrency:
  group: s11-3-3-query-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 調査依頼を確認
        id: request
        run: |
          set -euo pipefail
          read -r command run_date < materials/s11_3_3_diagnose.request
          test "$command" = "diagnose"
          [[ "$run_date" =~ ^2026[0-9]{4}$ ]]
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
      - name: train組織の検索条件だけを比較
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          python -I materials/s11_3_3_diagnose.py \
            --out-json "materials/s11_3_3_query_diagnostic_${RUN_DATE}.json"
      - name: 診断メタデータと完了状態を保存
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          echo "done $RUN_DATE" > materials/s11_3_3_diagnose.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "materials/s11_3_3_query_diagnostic_${RUN_DATE}.json" materials/s11_3_3_diagnose.request
          git commit -m "S11 3.3 BODIK検索条件の診断結果を記録"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
