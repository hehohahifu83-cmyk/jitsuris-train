name: 融合の試し（C1 ＋ 候補、CPU・学習なし）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/merge/merge.request"

permissions:
  actions: read
  contents: write

concurrency:
  group: merge-eval
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 依頼を読む
        id: req
        run: |
          if [ "$(head -1 research/merge/merge.request)" = "run" ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; else echo "proceed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.req.outputs.proceed == 'true'
        with: { python-version: '3.11' }
      - name: CPU の道具
        if: steps.req.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' 'safetensors==0.8.0' sentencepiece huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        if: steps.req.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: 40118170559
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/c1-model
      - name: C1 種子 1 の重みを照合
        if: steps.req.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          ck = Path("/tmp/c1-model/ft_out_job1")
          m = json.loads((ck / "manifest.json").read_text(encoding="utf-8"))
          name, meta = next(iter(m["saved_model"]["weights"].items()))
          want = "a7028e711568cfa9b8647b506838db7a353b5b7edf6c1ec8f131f6ac6ec89825"
          if hashlib.sha256((ck / name).read_bytes()).hexdigest() != want or meta["sha256"] != want:
              raise SystemExit("weight verification failed")
          print("verified")
          PY
      - name: 混ぜて予測する（ラベルは読まない）
        if: steps.req.outputs.proceed == 'true'
        env: { TOKENIZERS_PARALLELISM: 'false' }
        run: |
          set -eu
          mkdir -p research/merge/preds
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("intfloat/multilingual-e5-base", revision="d128750597153bb5987e10b1c3493a34e5a4502a", local_dir="/tmp/e5base", allow_patterns=["model.safetensors", "pytorch_model.bin", "config.json"])
          PY
          # 名前 候補 取るファイル 中のファイル（なければ空）
          cat > /tmp/list <<'LIST'
          pii FrameByFrame/korean-pii-e5-base *.safetensors,pytorch_model*.bin
          bem DeeAxe/business-entity-matching-encoders kA/model.pt kA/model.pt
          nli mjwong/multilingual-e5-base-xnli *.safetensors,pytorch_model*.bin
          fin BalyasnyAI/multilingual-e5-base *.safetensors,pytorch_model*.bin
          LIST
          while read -r tag repo pat file <&3; do
            [ -z "$tag" ] && continue
            rev=$(python -c "from huggingface_hub import HfApi; print(HfApi().model_info('$repo').sha)")
            python -c "from huggingface_hub import snapshot_download; snapshot_download('$repo', revision='$rev', local_dir='/tmp/cand', allow_patterns='$pat'.split(','))"
            for lam in 0.2 0.5; do
              t="${tag}${lam/0./}"
              python research/merge/merge_eval.py merge --c1 /tmp/c1-model/ft_out_job1 --base /tmp/e5base --cand /tmp/cand ${file:+--cand-file "$file"} \
                --cand-repo "$repo" --cand-rev "$rev" --lam "$lam" --tag "$t" --out /tmp/merged || { echo "$t: 混ぜられない（とばす）"; continue; }
              for b in b013 b014; do
                python evaluate_independent.py predict --set materials/pool/work/$b/set.json --checkpoint /tmp/merged \
                  --out research/merge/preds/${t}_${b}.json --ledger research/merge/ledger.jsonl --device cpu
              done
              python -c "import json; json.dump({'candidate': '$repo', 'revision': '$rev', 'lam': $lam, 'manifest_merge': json.load(open('/tmp/merged/manifest.json'))['extra']['merge']}, open('research/merge/preds/${t}_meta.json', 'w'), indent=1)"
              echo "$t" >> /tmp/tags
              rm -rf /tmp/merged
            done
            rm -rf /tmp/cand
          done 3< /tmp/list
          python research/merge/merge_eval.py score --tags c1 $(cat /tmp/tags) --out research/merge/RESULTS.md
          echo done > research/merge/merge.request
      - name: 予測と結果だけを保存
        if: always() && steps.req.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/merge/
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "融合の試し：予測と結果（自動）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
