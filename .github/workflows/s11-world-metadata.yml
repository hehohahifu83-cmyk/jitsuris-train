name: S11 3.4 非日本語公開表の候補調査（NZ）

on:
  push:
    branches: [main]
    paths:
      - "materials/s11_3_4_nz_discovery.request"

permissions:
  contents: write

concurrency:
  group: s11-3-4-nz-metadata-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自己テスト
        run: python -I materials/s11_3_4_discover_nz.py --self-test
      - name: 依頼を検査
        id: request
        run: |
          set -euo pipefail
          read -r command run_date < materials/s11_3_4_nz_discovery.request
          [[ "$command" == "register" || "$command" == "discover" ]]
          [[ "$run_date" =~ ^2026[0-9]{4}(-v[0-9]+)?$ ]]
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
      - name: 公開元だけを登録（データセットメタデータには未照会）
        if: steps.request.outputs.command == 'register'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: python -I materials/s11_3_4_discover_nz.py --mode register --run-date "$RUN_DATE"
      - name: train 公開元の候補メタデータを調査
        if: steps.request.outputs.command == 'discover'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: python -I materials/s11_3_4_discover_nz.py --mode discover --run-date "$RUN_DATE"
      - name: 結果と依頼状態を保存
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          echo "done $COMMAND $RUN_DATE" > materials/s11_3_4_nz_discovery.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/s11_3_4_discover_nz.py materials/s11_3_4_nz_discovery.request
          if [[ "$COMMAND" == "register" ]]; then
            git add independent_eval/allocation.json independent_eval/allocation_sources_20261022.json "materials/s11_3_4_nz_registration_${RUN_DATE}.json"
          else
            git add "materials/s11_3_4_candidates_${RUN_DATE}.json" "materials/s11_3_4_candidates_${RUN_DATE}.md"
          fi
          git commit -m "S11 3.4 NZ公開表候補をメタデータで記録"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
