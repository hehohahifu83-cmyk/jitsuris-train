name: 取り出しで落ちた表のファイルの取り方を診断する（状態コードだけ）
# 2026-11-01 Claude。research/fetch_diag/probe_downloads.py。中身は保存しない。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research/fetch_diag/probe.request]
permissions:
  contents: write
concurrency: { group: probe-downloads, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -I research/fetch_diag/probe_downloads.py
      - name: 保存
        run: |
          echo done > research/fetch_diag/probe.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fetch_diag/probe.json research/fetch_diag/probe.md research/fetch_diag/probe.request
          git diff --cached --quiet && exit 0
          git commit -m "取り出しで落ちた表の取り方の診断（自動）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
