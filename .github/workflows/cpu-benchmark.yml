name: CPU学習速度の比較
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run focused tests
        run: python -m unittest tests.test_cpu_speed tests.test_cpu_benchmark -v
      - name: Run benchmark
        run: python bench/cpu_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-training-benchmark
          path: |
            bench/cpu_benchmark_summary.md
            bench/cpu-runs/*.log
          if-no-files-found: ignore
          retention-days: 14
