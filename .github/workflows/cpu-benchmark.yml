name: CPU学習速度の比較
on:
  workflow_dispatch:
    inputs:
      run_selection:
        description: Run all six conditions or only the missing A2 repeat
        required: true
        type: choice
        options: [all, A2]
        default: all
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run focused tests
        run: python -m unittest tests.test_cpu_speed tests.test_cpu_benchmark -v
      - name: Run benchmark
        run: |
          if [ "${{ inputs.run_selection }}" = "A2" ]; then python bench/cpu_benchmark.py A2; else python bench/cpu_benchmark.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-training-benchmark
          path: |
            bench/cpu_benchmark*.md
            bench/cpu-runs/*.log
          if-no-files-found: ignore
          retention-days: 14
