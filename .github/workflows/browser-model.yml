name: ブラウザ用の書き出しの検査
concurrency: { group: browser-model, cancel-in-progress: false }
on:
  workflow_dispatch:
    inputs:
      model:
        description: '書き出すモデル（Hugging Face の名前か保存した場所。空なら学習していない e5-small で仕組みだけ確かめる）'
        required: false
        default: ''
      kaggle_run:
        description: '学習済みモデルを Kaggle 回収の実行（artifact jitsuris-model）から取る。その実行の番号、または latest（いちばん新しい回収）。空なら上の model を使う'
        required: false
        default: ''
      model_dir:
        description: 'artifact の中のモデルの置き場（FT_KEEP=1 の仕事は ft_out_job<番号>、仕事が 1 つなら ft_out）'
        required: false
        default: 'ft_out_job1'
      limit:
        description: '試験ごとの列数の上限（0 なら全部。学習済みモデルの精度を測るときは 0）'
        required: false
        default: '100'
  push:
    branches: [main]
    # browser_test/run.request：Actions を直接起動できない側（ChatGPT など）が、この 1 行ファイルを書き換えて起動する（下の「実行の条件を決める」）
    paths: ['browser_test/*.mjs', 'browser_test/run.request', 'check_trained_model.py', 'export_onnx.py', 'compress_eval.py', 'edge_texts.py', 'tests/test_export_onnx.py', 'tests/test_compress_eval.py', '.github/workflows/browser-model.yml']
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - name: 実行の条件を決める（手動の入力、または browser_test/run.request）
        id: cfg
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          MODEL="${{ inputs.model }}"; KRUN="${{ inputs.kaggle_run }}"; MDIR="${{ inputs.model_dir }}"; LIMIT="${{ inputs.limit }}"; MSHA=""
          # 依頼ファイル：1 行に「キー=値」を空白で区切って書く（例：kaggle_run=latest model_dir=ft_out_job1 limit=0）。# で始まる行は読まない。
          # この push で変わったときだけ読む（ほかのファイルの push で、前の依頼がまた走らないように）。
          if [ "${{ github.event_name }}" = push ] && [ -f browser_test/run.request ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qx 'browser_test/run.request'; then
            for kv in $(grep -v '^#' browser_test/run.request | head -1); do
              echo "$kv" | grep -qE '^[a-z_]+=[A-Za-z0-9._/:@-]*$' || { echo "読めない指定は飛ばす: $kv"; continue; }
              case "$kv" in
                model=*) MODEL="${kv#model=}";;
                kaggle_run=*) KRUN="${kv#kaggle_run=}";;
                model_dir=*) MDIR="${kv#model_dir=}";;
                limit=*) LIMIT="${kv#limit=}";;
                model_sha256=*) MSHA="${kv#model_sha256=}";;
              esac
            done
            echo "依頼ファイルから: model=$MODEL kaggle_run=$KRUN model_dir=$MDIR limit=$LIMIT model_sha256=${MSHA:-（なし）}"
          fi
          if [ "$KRUN" = latest ]; then
            KRUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=jitsuris-model&per_page=20" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
            [ -n "$KRUN" ] || { echo "jitsuris-model の artifact が見つからない（期限切れか、まだ回収されていない）"; exit 1; }
            echo "いちばん新しい jitsuris-model の回収: $KRUN"
          fi
          [ -z "$MDIR" ] && MDIR=ft_out_job1
          [ -z "$LIMIT" ] && LIMIT=100
          if [ -n "$MSHA" ] && ! echo "$MSHA" | grep -qE '^[0-9a-fA-F]{64}$'; then echo "model_sha256 は 64 桁の 16 進で書く: $MSHA"; exit 1; fi
          { echo "model=$MODEL"; echo "kaggle_run=$KRUN"; echo "model_dir=$MDIR"; echo "limit=$LIMIT"; echo "model_sha256=$MSHA"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 依存を入れる（CPU 版）
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece tokenizers onnx onnxruntime onnxscript
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: 部品の検査
        shell: bash
        run: python -m unittest tests.test_export_onnx tests.test_compress_eval tests.test_tokenizer_fixtures tests.test_check_trained_model -v 2>&1 | tee unittest.log | tail -40
      - uses: actions/cache/restore@v4
        id: bmcache
        with:
          path: browser_model
          key: bm-${{ hashFiles('export_onnx.py', 'compress_eval.py', 'edge_texts.py') }}-${{ steps.cfg.outputs.model || 'default' }}-${{ steps.cfg.outputs.kaggle_run || 'none' }}-${{ steps.cfg.outputs.model_dir }}-${{ steps.cfg.outputs.limit }}-${{ steps.cfg.outputs.model_sha256 || 'nosha' }}
      - name: 学習済みモデルを取ってくる（Kaggle 回収の artifact）
        if: steps.cfg.outputs.kaggle_run != '' && steps.bmcache.outputs.cache-hit != 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          gh run download "${{ steps.cfg.outputs.kaggle_run }}" -R "$GITHUB_REPOSITORY" -n jitsuris-model -D trained
          ls -la "trained/${{ steps.cfg.outputs.model_dir }}" | head -20
          # 取ったモデルが、manifest.json と依頼（model_sha256）の重みと同じかを確かめる。食い違えばここで止める（別の仕事の重みを書き出さない）
          SHA="${{ steps.cfg.outputs.model_sha256 }}"
          python check_trained_model.py "trained/${{ steps.cfg.outputs.model_dir }}" ${SHA:+--expect-sha256 "$SHA"} --out trained_model_check.json
      - name: 書き出しと試験（学習していないモデルなら精度の数字に意味はない。大きさ・動くこと・速さの確認）
        if: steps.bmcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          MODEL="${{ steps.cfg.outputs.model }}"; [ -z "$MODEL" ] && MODEL=intfloat/multilingual-e5-small
          EXTRA=""
          if [ -n "${{ steps.cfg.outputs.kaggle_run }}" ]; then MODEL="trained/${{ steps.cfg.outputs.model_dir }}"; EXTRA="--labels $MODEL/labels.json"; fi
          python export_onnx.py --model "$MODEL" --out browser_model --limit "${{ steps.cfg.outputs.limit }}" --reference 40 $EXTRA 2>&1 | tee export.log | tail -60
      - uses: actions/cache/save@v4
        if: always() && steps.bmcache.outputs.cache-hit != 'true' && hashFiles('browser_model/reference.json') != ''
        with:
          path: browser_model
          key: bm-${{ hashFiles('export_onnx.py', 'compress_eval.py', 'edge_texts.py') }}-${{ steps.cfg.outputs.model || 'default' }}-${{ steps.cfg.outputs.kaggle_run || 'none' }}-${{ steps.cfg.outputs.model_dir }}-${{ steps.cfg.outputs.limit }}-${{ steps.cfg.outputs.model_sha256 || 'nosha' }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 正規化の単体試験（Node。自作の小さな表で、書記素・最初に見つかった規則などの動きを確かめる）
        shell: bash
        run: node --test browser_test/charsmap.unit.test.mjs 2>&1 | tee charsmap_unit.log | grep -E '^(# (tests|pass|fail)|not ok)'
      - name: ブラウザで動かす試験（headless Chromium・WASM・外への通信は止める）
        shell: bash
        run: |
          mkdir -p /tmp/js && cp browser_test/run.mjs browser_test/charsmap.mjs /tmp/js/ && cd /tmp/js && npm init -y >/dev/null
          npm i @huggingface/transformers playwright 2>&1 | tail -2
          npx playwright install --with-deps chromium 2>&1 | tail -2
          node run.mjs "$GITHUB_WORKSPACE/browser_model" "$GITHUB_WORKSPACE/browser_model/reference.json" "$GITHUB_WORKSPACE/browser_result.json" 2>&1 | tee "$GITHUB_WORKSPACE/browser_js.log" | tail -80
      - name: 正規化の一致試験（Chromium の中で。書記素の分け方が Node と違っても同じ答えか。軽い正解データ）
        if: always()
        shell: bash
        run: |
          if [ -d /tmp/js/node_modules/playwright ]; then
            cp browser_test/charsmap.chromium.test.mjs browser_test/charsmap.mjs /tmp/js/ && cp -r browser_test/fixtures /tmp/js/fixtures
            cd /tmp/js && node charsmap.chromium.test.mjs /tmp/js/fixtures 2>&1 | tee "$GITHUB_WORKSPACE/charsmap_chromium.log" | tail -30
          else
            echo "playwright が入っていない（前の手順が失敗）" | tee "$GITHUB_WORKSPACE/charsmap_chromium.log"; exit 1
          fi
      - name: 書き出したものを置く（軽いものだけ）
        if: always()
        run: |
          mkdir -p keep && cp browser_model/REPORT.md keep/ 2>/dev/null || true
          cp -r browser_model/onnx/model_quantized.onnx browser_model/tokenizer.json browser_model/tokenizer_config.json browser_model/config.json browser_model/charsmap.bin keep/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-model-check, path: keep, retention-days: 14, if-no-files-found: ignore }
      - name: 結果を記録する
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee record.log) 2>&1
          set -x
          KRUN="${{ steps.cfg.outputs.kaggle_run }}"; MDIR="${{ steps.cfg.outputs.model_dir }}"
          # ログは取りに行けないので、失敗のときも要点（ログの末尾）をリポジトリに書く。
          # 先に別の場所に作っておき、最新の main に重ねて commit する（先に流れた別の実行の記録と競合しないように。競合したら自分の結果を優先する）
          T=$(mktemp -d)
          { echo "# ブラウザ用の書き出しの検査のログの末尾"; echo; echo "run: ${{ github.run_id }}　commit: ${{ github.sha }}"; echo; echo '## 部品の検査'; echo '```'; tail -60 unittest.log 2>/dev/null; echo '```'; echo '## 書き出し'; echo '```'; tail -80 export.log 2>/dev/null; echo '```'; } > "$T/browser_model_log.md"
          OK=0; [ -f browser_model/REPORT.md ] && OK=1
          SUMMARY=browser_model_summary.md; [ -n "$KRUN" ] && SUMMARY=browser_model_trained_summary.md
          if [ "$OK" = 1 ]; then
            { echo "# ブラウザ用の書き出しの検査（GitHub Actions・CPU）"; echo; echo "run: ${{ github.run_id }}　commit: ${{ github.sha }}　学習済みモデル: $KRUN $MDIR"; echo; cat browser_model/REPORT.md; echo; echo "## ブラウザ（headless Chromium・WASM・Transformers.js）で動かした結果"; echo '```json'; cat browser_result.json 2>/dev/null || echo "（結果なし）"; echo '```'; } > "$T/$SUMMARY"
            [ -f charsmap_chromium.log ] && { echo; echo "## 正規化の一致（Chromium の中・軽い正解データ）"; echo '```'; sed -n '/=== 要点/,$p' charsmap_chromium.log; echo '```'; } >> "$T/$SUMMARY"
            [ -f trained_model_check.json ] && { echo; echo "## 学習済みモデルの確認（重みの SHA-256・manifest・依頼との照合）"; echo '```json'; cat trained_model_check.json; echo '```'; } >> "$T/$SUMMARY"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$T/browser_model_log.md" bench/
            git add bench/browser_model_log.md
            if [ "$OK" = 1 ]; then cp "$T/$SUMMARY" "bench/$SUMMARY"; git add "bench/$SUMMARY"; fi
            git diff --cached --quiet && break
            git commit -q -m "$([ "$OK" = 1 ] && echo 'ブラウザ用の書き出しの検査の結果（CPU）' || echo 'ブラウザ用の書き出しの検査のログ（失敗）')"
            git push -q && break
            sleep 3
          done
          [ "$OK" = 1 ] || { echo "REPORT.md がない（書き出しが失敗）"; exit 1; }
      - name: 要点を注（アノテーション）に出す（ログは取りに行けないが、注は API で読める）
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          def emit(path, title, n=3200):
              if not os.path.exists(path): return
              ls = open(path, encoding="utf-8", errors="replace").read().splitlines()[-28:]
              t = "\n".join(l[-200:] for l in ls)[-n:]   # 長い行は後ろ（理由が書いてある所）を残す
              t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={title}::{t}")
          for p, title in [("unittest.log", "unittest"), ("charsmap_unit.log", "charsmap_unit"), ("charsmap_chromium.log", "charsmap_chromium"), ("export.log", "export"), ("browser_model/REPORT.md", "REPORT"), ("browser_js.log", "browser_js"), ("record.log", "record")]:
              emit(p, title)
          PY
