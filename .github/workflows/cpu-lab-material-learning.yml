name: CPU lab audited replay
on:
  workflow_run:
    workflows: ["Kaggle の GPU で学習"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Kaggle wait-cycle run; CPU proceeds only if the kernel remains queued
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: jitsuris-cpu-training
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      source_run_id: ${{ steps.gate.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle status client
        run: python -m pip install kaggle
      - name: Confirm E5 run and QUEUED Kaggle kernel
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ.get("EVENT_SOURCE_RUN_ID") or os.environ.get("MANUAL_SOURCE_RUN_ID", "")
          if not re.fullmatch(r"[0-9]{5,20}", run_id):
              raise SystemExit("No valid Kaggle source run ID; refusing to start")
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          source = get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if source.get("path") != ".github/workflows/kaggle.yml" or source.get("status") != "completed" or source.get("conclusion") != "success":
              raise SystemExit("Kaggle source run is not successful; refusing to start")
          request = Path("kaggle/kaggle.request").read_text(encoding="utf-8").strip()
          if request != "fetch":
              print("CPU lab held: no fetch/wait cycle is active")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"proceed=false\nsource_run_id={run_id}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary: summary.write("Held: Kaggle request is not in fetch/wait state.\n")
              raise SystemExit(0)
          log = Path("kaggle/KAGGLE_LOG.md").read_text(encoding="utf-8")
          requests = [line for line in log.splitlines() if "train を依頼" in line]
          statuses = [line for line in log.splitlines() if "KernelWorkerStatus." in line]
          if not requests or "multilingual-e5-base" not in requests[-1] or "FT_FREEZE_EMB=1" not in requests[-1]:
              print("CPU lab held: newest training request is not the target E5-base run")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"proceed=false\nsource_run_id={run_id}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary: summary.write("Held: latest Kaggle request does not match the target E5-base experiment.\n")
              raise SystemExit(0)
          import subprocess
          key = os.environ["KAGGLE_KEY"]
          if key.startswith("KGAT_"): os.environ["KAGGLE_API_TOKEN"] = key
          state = subprocess.run(["kaggle", "kernels", "status", "jitsurio/jitsuris-train"], capture_output=True, text=True)
          combined = state.stdout + state.stderr
          print("Observed Kaggle status:", combined.strip())
          if state.returncode != 0 or "KernelWorkerStatus.QUEUED" not in combined:
              print("CPU lab held: CPU work is allowed only while Kaggle is QUEUED")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"proceed=false\\nsource_run_id={run_id}\\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary: summary.write("Held: Kaggle is not QUEUED. CPU lab only runs during the queue window.\\n")
              raise SystemExit(0)
          runs = get(f"https://api.github.com/repos/{repo}/actions/runs?per_page=100").get("workflow_runs", [])
          active = [r for r in runs if r.get("path") == ".github/workflows/kaggle.yml" and r.get("status") == "in_progress"]
          if active:
              print("CPU lab held: another Kaggle workflow is active")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"proceed=false\nsource_run_id={run_id}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary: summary.write("Held: another Kaggle training workflow is active.\n")
              raise SystemExit(0)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out: out.write(f"proceed=true\nsource_run_id={run_id}\n")
          print(f"All gates passed for Kaggle run {run_id}")
          PY
      - name: Download only approved labeled training corpora
        if: steps.gate.outputs.proceed == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip kaggle
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          mkdir -p /tmp/jitsuris-data
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from kaggle.api.kaggle_api_extended import KaggleApi

          dataset = "jitsurio/jitsuris-data"
          allowed = {
              "real_labels.jsonl", "real_labels_biz.jsonl", "real_labels_biz2.jsonl",
              "real_labels_direct.jsonl", "real_labels_jp.jsonl", "real_labels_jp2.jsonl",
          }
          api = KaggleApi()
          api.authenticate()
          page = api.dataset_list_files(dataset)
          names = []
          while page:
              for item in page.files:
                  name = item.name
                  if any(name == f"materials/{base}" or name.endswith(f"/materials/{base}") for base in allowed):
                      names.append(name)
              token = getattr(page, "next_page_token", None)
              if not token:
                  break
              page = api.dataset_list_files(dataset, page_token=token)
          if not names:
              raise SystemExit("No allowlisted real_labels*.jsonl training corpora are listed")
          for name in names:
              subprocess.run(
                  ["kaggle", "datasets", "download", "-d", dataset, "-f", name,
                   "-p", "/tmp/jitsuris-data", "--unzip"],
                  check=True,
              )
          root = Path("/tmp/jitsuris-data")
          copied = []
          for name in names:
              base = name.rsplit("/", 1)[-1]
              matches = list(root.glob(f"**/materials/{base}"))
              if matches:
                  dest = Path("materials") / base
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(matches[0].read_bytes())
                  copied.append(base)
          if not copied:
              raise SystemExit("Allowlisted corpus files downloaded but none were extracted")
          print("Copied allowlisted training corpora:", ", ".join(sorted(set(copied))))
          PY
      - name: Score baseline probe and prepare material receipt
        if: steps.gate.outputs.proceed == 'true'
        env:
          SOURCE_RUN_ID: ${{ steps.gate.outputs.source_run_id }}
          FT_CPU_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          mkdir -p prepared
          python -m unittest discover -s cpu_lab/tests -v
          python cpu_lab/material_receipt.py prepare-reviewed --materials cpu_lab/materials/reviewed_replay.jsonl --source-model "hub:intfloat/multilingual-e5-base" --out prepared/material_receipt.json
      - name: Upload prepared data and baseline evidence
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-lab-prepared-${{ github.run_id }}
          path: |
            prepared/material_receipt.json
            cpu_lab/materials/reviewed_replay.jsonl
            materials/real_labels*.jsonl
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  train:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        seed: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpu-lab-prepared-${{ github.run_id }}
          path: prepared
      - name: Restore allowlisted training corpora
        run: |
          mkdir -p materials
          cp prepared/materials/real_labels*.jsonl materials/ 2>/dev/null || cp prepared/real_labels*.jsonl materials/
          cp prepared/cpu_lab/materials/reviewed_replay.jsonl cpu_lab/materials/reviewed_replay.jsonl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece kaggle
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train one matched CPU seed and record material exposure
        env:
          FT_CPU_THREADS: '2'
          FT_CPU_LAB_REPLAY: cpu_lab/materials/reviewed_replay.jsonl
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FT_LIMIT_PER_LABEL: '80'
          FT_SAMPLE_SEED: '20261018'
          FT_BS: '16'
          FT_ACC: '2'
          FT_CKPT: '0'
          FT_SORT: '1'
          FT_PAD8: '0'
          FT_FUSED: '0'
          FT_CTX_UNIT: '1'
          FT_FREEZE_EMB: '1'
          FT_SEED: ${{ matrix.seed }}
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          mkdir -p "cpu_results/seed-${{ matrix.seed }}"
          cp prepared/prepared/material_receipt.json "cpu_results/seed-${{ matrix.seed }}/material_receipt.json"
          state=$(kaggle kernels status jitsurio/jitsuris-train 2>&1 || true)
          if ! grep -q 'KernelWorkerStatus.QUEUED' <<< "$state"; then
            echo "CPU lab held before launch because Kaggle is no longer queued: $state"
            exit 0
          fi
          set +e
          setsid /usr/bin/time -v python finetune_exp.py intfloat/multilingual-e5-base 1 > "cpu_results/seed-${{ matrix.seed }}/train.log" 2>&1 &
          trainer_pid=$!
          ( while kill -0 "$trainer_pid" 2>/dev/null; do
              state=$(kaggle kernels status jitsurio/jitsuris-train 2>&1 || true)
              printf '%s Kaggle status: %s\n' "$(date -u +%FT%TZ)" "$state" >> "cpu_results/seed-${{ matrix.seed }}/kaggle_guard.log"
              if ! grep -q 'KernelWorkerStatus.QUEUED' <<< "$state"; then
                touch /tmp/jitsuris-kaggle-no-longer-queued
                kill -TERM -- "-$trainer_pid" 2>/dev/null || kill -TERM "$trainer_pid" 2>/dev/null || true
                break
              fi
              sleep 30
            done ) &
          guard_pid=$!
          wait "$trainer_pid"; train_rc=$?
          kill "$guard_pid" 2>/dev/null || true
          wait "$guard_pid" 2>/dev/null || true
          set -e
          cat "cpu_results/seed-${{ matrix.seed }}/train.log"
          if [ -e /tmp/jitsuris-kaggle-no-longer-queued ]; then
            echo "CPU lab yielded immediately because Kaggle left QUEUED; this partial run is not treated as a result."
            exit 0
          fi
          if [ "$train_rc" -ne 0 ]; then exit "$train_rc"; fi
          python cpu_lab/material_receipt.py mark-trained --receipt "cpu_results/seed-${{ matrix.seed }}/material_receipt.json" --train-log "cpu_results/seed-${{ matrix.seed }}/train.log" --seed ${{ matrix.seed }} --out "cpu_results/seed-${{ matrix.seed }}/material_receipt.json"
          state=$(kaggle kernels status jitsurio/jitsuris-train 2>&1 || true)
          if ! grep -q 'KernelWorkerStatus.QUEUED' <<< "$state"; then echo "Kaggle no longer queued; stop before CPU evaluation."; exit 0; fi
          cp FINETUNE_RESULTS.md "cpu_results/seed-${{ matrix.seed }}/"
          cp cpu_lab/materials/reviewed_replay.jsonl "cpu_results/seed-${{ matrix.seed }}/audited_materials_used.jsonl"
      - name: Upload per-seed training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-lab-audited-replay-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: cpu_results/seed-${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
