name: CPU lab material screening
on:
  workflow_dispatch:
    inputs:
      confirm_cpu:
        description: Run CPU model diagnostics and create an uncertainty review queue
        required: true
        type: choice
        options: [no, yes]
        default: no
      source_run_id:
        description: Completed successful Kaggle run containing the trained classifier artifact
        required: true
        type: string
      model_subdir:
        description: Model directory inside the jitsuris-model artifact
        required: true
        type: choice
        options: [ft_out, ft_out_job1, ft_out_job2, ft_out_job3]
        default: ft_out_job1
permissions:
  contents: read
  actions: read
concurrency:
  group: jitsuris-cpu-training
  cancel-in-progress: false
jobs:
  screen:
    if: ${{ inputs.confirm_cpu == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate source Kaggle run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          run_id = os.environ["SOURCE_RUN_ID"]
          if not re.fullmatch(r"[0-9]{5,20}", run_id):
              raise SystemExit("source_run_id must be a numeric GitHub Actions run ID")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as response:
              run = json.load(response)
          if run.get("path") != ".github/workflows/kaggle.yml" or run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source must be a completed successful Kaggle workflow run")
          print(f"validated Kaggle source run {run_id}: {run.get('html_url')}")
          PY
      - name: Download trained classifier artifact
        uses: actions/download-artifact@v4
        with:
          name: jitsuris-model
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate checkpoint and score the diagnostic probe
        env:
          MODEL_SUBDIR: ${{ inputs.model_subdir }}
        run: |
          set -euo pipefail
          MODEL="source-models/$MODEL_SUBDIR"
          test -s "$MODEL/config.json"
          test -s "$MODEL/labels.json"
          python cpu_lab/progress_probe.py score --model "$MODEL" --probe cpu_lab/materials/progress_probe.jsonl --out probe_before.json
      - name: Rank uncertain materials for independent labeling
        env:
          MODEL_SUBDIR: ${{ inputs.model_subdir }}
          FT_CPU_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          MODEL="source-models/$MODEL_SUBDIR"
          python cpu_lab/self_learning.py select --model "$MODEL" --pool cpu_lab/materials/pool.jsonl --out review_queue.jsonl --budget 36 --batch-size 12
      - name: Upload screening evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpu-lab-screening-${{ github.run_id }}
          path: |
            review_queue.jsonl
            probe_before.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Explain result limits
        run: |
          echo "This run screens candidate material and scores a synthetic diagnostic probe only." >> "$GITHUB_STEP_SUMMARY"
          echo "No training is performed: model-generated labels are not independent ground truth." >> "$GITHUB_STEP_SUMMARY"
          echo "Training requires independently verified labels; the probe is never used for training." >> "$GITHUB_STEP_SUMMARY"
