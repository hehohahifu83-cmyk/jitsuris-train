name: CPU lab safety tests
on:
  push:
    paths:
      - 'cpu_lab/**'
      - 'finetune_exp.py'
      - 'guard.py'
      - 'train3.py'
      - 'tests/test_guard.py'
      - 'tests/test_decision_reasons.py'
      - 'evaluation_records.py'
      - 'tests/test_evaluation_records.py'
      - 'tests/test_eval_artifact_integrity.py'
      - 'abstain_eval.py'
      - 'tests/test_abstain_eval.py'
      - '.github/workflows/cpu-lab-tests.yml'
      - '.github/workflows/cpu-lab-material-learning.yml'
  pull_request:
    paths:
      - 'cpu_lab/**'
      - 'finetune_exp.py'
      - 'guard.py'
      - 'train3.py'
      - 'tests/test_guard.py'
      - 'tests/test_decision_reasons.py'
      - 'evaluation_records.py'
      - 'tests/test_evaluation_records.py'
      - 'tests/test_eval_artifact_integrity.py'
      - '.github/workflows/cpu-lab-tests.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile trainer and evaluation utilities
        run: python -m py_compile finetune_exp.py evaluation_records.py abstain_eval.py guard.py train3.py cpu_lab/self_learning.py cpu_lab/material_receipt.py cpu_lab/progress_probe.py cpu_lab/compare_replay_probe.py jobs.py kaggle/run.py
      - name: Check decision reason parity
        run: python -m unittest discover -s tests -p 'test_decision_reasons.py' -v
      - name: Check scored evaluation row contract
        run: python -m unittest discover -s tests -p 'test_evaluation_records.py' -v
      - name: Check evaluation artifact completeness and parity
        run: python -m unittest discover -s tests -p 'test_eval_artifact_integrity.py' -v
      - name: Check abstention audit schema and thresholds
        run: python -m unittest discover -s tests -p 'test_abstain_eval.py' -v
      - name: Verify leakage and approval guards
        run: python -m unittest discover -s cpu_lab/tests -v
