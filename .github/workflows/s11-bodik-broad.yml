name: S11 3.5 BODIK broad metadata discovery

on:
  push:
    branches: [main]
    paths:
      - "materials/s11_3_5_discovery.request"

permissions:
  contents: write

concurrency:
  group: s11-3-5-bodik-broad-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自己テスト
        run: python -I materials/s11_3_5_bodik_discover.py --self-test
      - name: 依頼を検査
        id: request
        run: |
          set -euo pipefail
          read -r command run_date < materials/s11_3_5_discovery.request
          [[ "$command" == "discover" || "$command" == "done" ]]
          [[ "$run_date" =~ ^2026[0-9]{4}-v[0-9]+$ ]]
          echo "execute=$([[ "$command" == "discover" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
      - name: train BODIK の広域メタデータを探索
        if: steps.request.outputs.execute == 'true'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          python -I materials/s11_3_5_bodik_discover.py --mode discover \
            --allocation independent_eval/allocation.json \
            --sources independent_eval/allocation_sources_20261021.json \
            --out-json "materials/s11_3_5_candidates_${RUN_DATE}.json" \
            --out-md "materials/s11_3_5_candidates_${RUN_DATE}.md"
      - name: 候補一覧と依頼状態を保存
        if: steps.request.outputs.execute == 'true'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          echo "done $RUN_DATE" > materials/s11_3_5_discovery.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/s11_3_5_bodik_discover.py materials/s11_3_5_discovery.request
          git add "materials/s11_3_5_candidates_${RUN_DATE}.json" "materials/s11_3_5_candidates_${RUN_DATE}.md"
          git commit -m "S11 3.5 BODIK 広域候補を収集"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
