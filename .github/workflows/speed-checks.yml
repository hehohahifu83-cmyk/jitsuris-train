name: 速くする設定の検査
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [batching.py, jobs.py, finetune_exp.py, compress_eval.py, tests/test_compress_eval.py, speed_probe.py, kaggle/run.py, guard.py, rescore_guard.py, compare_runs.py, abstain_eval.py, analyze_errors.py, tests/test_guard.py, tests/test_jobs.py, tests/test_batching.py, tests/test_jobs.py, tests/test_sort_equivalence.py, .github/workflows/speed-checks.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 依存を入れる（CPU 版）
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn transformers sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: 部品の検査（束の分け方・仕事の分け方・勾配の一致）
        run: python -m unittest tests.test_batching tests.test_jobs tests.test_sort_equivalence tests.test_guard tests.test_compare_runs tests.test_abstain_eval tests.test_analyze_errors tests.test_rescore_guard tests.test_compress_eval -v
      - name: 通しの検査 A（今までの流し方、ドロップアウトなし）
        env: { FT_NO_DROPOUT: '1', FT_LIMIT: '640', FT_SEED: '1', FT_EVAL: dev220, FT_TRACE_LOSS: '5', FT_BS: '8', FT_ACC: '8', FT_SORT: '0' }
        shell: bash
        run: python finetune_exp.py intfloat/multilingual-e5-small 1 2>&1 | tee a.log | grep -E "step_loss|train batch|学習 [0-9]+秒" | cut -c1-260
      - name: 通しの検査 B（長さ順の束＋幅8の倍数、ドロップアウトなし）
        env: { FT_NO_DROPOUT: '1', FT_LIMIT: '640', FT_SEED: '1', FT_EVAL: dev220, FT_TRACE_LOSS: '5', FT_BS: '8', FT_ACC: '8', FT_SORT: '1', FT_PAD8: '1' }
        shell: bash
        run: python finetune_exp.py intfloat/multilingual-e5-small 1 2>&1 | tee b.log | grep -E "step_loss|train batch|学習 [0-9]+秒" | cut -c1-260
      - name: A と B の最初の損失が同じか
        run: |
          python - <<'PY'
          import re
          def losses(p): return [float(x) for x in re.findall(r"^step_loss \d+ ([0-9.]+)$", open(p, encoding="utf-8").read(), re.M)]
          a, b = losses("a.log"), losses("b.log")
          print("A", a); print("B", b)
          assert len(a) >= 5 and len(b) >= 5, "損失の記録が足りない"
          diff = max(abs(x - y) for x, y in zip(a[:5], b[:5]))
          print("最大の差", diff)
          assert diff < 2e-3, "束の分け方で損失が変わった"
          PY
      - name: 通しの検査 C（水増し＋長さ順＋fp32、ふだんのドロップアウトあり）
        env: { FT_LIMIT: '320', FT_SEED: '2', FT_EVAL: dev220, FT_BS: '8', FT_ACC: '4', FT_SORT: '1', FT_PAD8: '1', FT_AUG: '1' }
        shell: bash
        run: python finetune_exp.py intfloat/multilingual-e5-small 1 2>&1 | tee c.log | grep -E "Traceback|Error|train batch|学習 [0-9]+秒" | cut -c1-260
      - name: 通しの検査 D（単語の埋め込みを固定）
        env: { FT_LIMIT: '320', FT_SEED: '2', FT_EVAL: dev220, FT_BS: '8', FT_ACC: '4', FT_SORT: '1', FT_FREEZE_EMB: '1' }
        shell: bash
        run: python finetune_exp.py intfloat/multilingual-e5-small 1 2>&1 | tee d.log | grep -E "Traceback|Error|train batch|学習 [0-9]+秒" | cut -c1-260
      - name: 通しの検査 E（縮めた版の試験：語彙削減・INT8・fp16。小さく）
        env: { FT_LIMIT: '320', FT_SEED: '2', FT_EVAL: dev220, FT_BS: '8', FT_ACC: '4', FT_SORT: '1', FT_COMPRESS: '1', FT_COMPRESS_LIMIT: '60' }
        shell: bash
        run: |
          python finetune_exp.py intfloat/multilingual-e5-small 1 2>&1 | tee e.log | grep -E "Traceback|Error|圧縮|train batch" | cut -c1-300
          python - <<'PY'
          t = open("FINETUNE_RESULTS.md", encoding="utf-8").read()
          rows = [l for l in t.splitlines() if "・圧縮【" in l]
          print(len(rows), "行"); print("\n".join(t.splitlines()[-12:]))
          assert len(rows) >= 10, "圧縮の行が足りない（6 通り × 2 つの組み合わせ。動的量子化が動かない環境では 10 行）"
          assert "圧縮の試験は失敗" not in t
          PY
      - name: 測定プログラムの通しの検査（CPU・小さく。数字は GPU の結果ではない）
        shell: bash
        env: { FT_PROBE_EFF: '16', FT_PROBE_BATCHES: '3', FT_PROBE_CONFIGS: 'B01,B04', FT_PROBE_NO_DUAL: '1' }
        run: |
          python speed_probe.py intfloat/multilingual-e5-small 2>&1 | tee p.log | grep -E "→|トークン数の分布|Traceback|Error" | cut -c1-400
          python - <<'PY'
          import json
          r = json.load(open("probe_results.json"))
          assert r["results"] and all(x["status"] == "ok" for x in r["results"]), r["results"]
          eq = r["equiv"]
          assert eq and all(t["status"] == "ok" and t["cos"] > 0.99999 for t in eq["tests"]), eq
          print("測定プログラムの検査 ok", [(t["name"], t["cos"], t["rel_err"]) for t in eq["tests"]])
          PY
      - name: 結果を記録する（ログは取りに行けないので、要点をリポジトリに書く）
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import re, os
          def read(p): return open(p, encoding="utf-8").read() if os.path.exists(p) else ""
          def losses(t): return [float(x) for x in re.findall(r"^step_loss \d+ ([0-9.]+)$", t, re.M)]
          def secs(t): m = re.findall(r"学習 ([0-9.]+)秒・評価 ([0-9.]+)秒", t); return m[-1] if m else None
          def cfgline(t): m = re.findall(r"^train batch=.*$", t, re.M); return m[-1] if m else "(記録なし)"
          logs = {k: read(k.lower() + ".log") for k in "ABCD"}
          a, b = losses(logs["A"]), losses(logs["B"])
          diff = max((abs(x - y) for x, y in zip(a[:5], b[:5])), default=None)
          out = ["# 速くする設定の検査（CPU・e5-small・GitHub Actions）", "", f"run: ${{ github.run_id }}　commit: ${{ github.sha }}", ""]
          out += ["| 検査 | 設定 | 学習秒・評価秒 | 最初の損失 |", "|---|---|---|---|"]
          for k, name in (("A", "今までの流し方"), ("B", "長さ順の束＋幅8の倍数"), ("C", "水増し＋長さ順＋幅8"), ("D", "単語の埋め込みを固定＋長さ順")):
              out.append(f"| {k} {name} | {cfgline(logs[k])} | {secs(logs[k])} | {losses(logs[k])[:5] or '—'} |")
          out += ["", f"A と B の最初の5ステップの損失の最大の差：{diff}（ドロップアウトを切り、同じ種・同じ実効バッチ。基準 2e-3 未満）", "",
                  "CPU（fp32・e5-small・640行）の検査であり、GPU（fp16）での速さや品質の結果ではない。"]
          t_all = read("FINETUNE_RESULTS.md")
          sec = t_all.split("\n### ")[-1] if "\n### " in t_all else ""
          cnotes = [l for l in sec.splitlines() if l.startswith("- ")]
          if any("圧縮の試験" in l for l in cnotes):
              out += ["", "縮めた版の試験（検査 E。CPU・e5-small・学習は 320 行だけの出来の悪いモデルなので、語彙の残り方・大きさ・動くことの確認用。判定の質の結果ではない）："] + cnotes
          import json
          pr = json.load(open("probe_results.json")) if os.path.exists("probe_results.json") else None
          if pr and pr.get("equiv"):
              out += ["", "測定プログラム（speed_probe.py）の勾配の一致（CPU・fp32・実効バッチ16）：" + "；".join(f"{t['name']} 一致度{t.get('cos')}・相対差{t.get('rel_err')}" for t in pr["equiv"]["tests"] if t.get("status") == "ok")]
          open("bench/speed_checks_summary.md", "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -- FINETUNE_RESULTS.md 2>/dev/null || true   # 通しの検査が追記した分は捨てる（pull --rebase が止まるため）
          git add bench/speed_checks_summary.md
          git diff --cached --quiet && exit 0
          git commit -m "速くする設定の検査の結果（CPU）"
          for i in 1 2 3; do git push && break; git pull --rebase --autostash; done
