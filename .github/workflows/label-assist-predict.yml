name: 教材のラベルの手伝い：今のモデルで予測（CPU）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "materials/label_assist/predict.request"

permissions:
  actions: read
  contents: write

concurrency:
  group: label-assist-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: 依頼を読む
        id: req
        run: |
          set -eu
          # 形：run <set> <out> [c1]。c1 を付けると教材庫を学習した C1（run 40118170559 の種子 1）で予測する（2026-10-25、重大検知役を C1 用に作り直すため）
          read -r cmd set_path out_path model <<< "$(head -1 materials/label_assist/predict.request)"
          if [ "$cmd" != "run" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$set_path" in materials/label_assist/*_set.json|materials/pool/work/*/set.json) ;; *) echo "set の場所が違う"; exit 1;; esac
          model="${model:-e5}"
          if [ "$model" = "c1" ]; then
            case "$out_path" in materials/pool/work/*/pred_c1_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40118170559; want=a7028e711568cfa9b8647b506838db7a353b5b7edf6c1ec8f131f6ac6ec89825; label="C1（教材庫を学習、種子 1）"
          elif [ "$model" = "c2" ]; then
            # 2026-10-26：C2（教材庫 b014 まで＋題名、run 40202377192 の種子 1）。b015 以降で C2 の線を決め直すため。題名は予測ファイルの経路では入れない（＝題名なしの形）
            case "$out_path" in materials/pool/work/*/pred_c2_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40202377192; want=44404b339a9c3023d23f5bac67bdb81ad3aa64a16a95b3d7007f5e6f5b78fcf4; label="C2（教材庫 b014 まで＋題名、種子 1）"
          elif [ "$model" = "c2t" ]; then
            # 2026-10-30：C2 と同じ重みで、入力に表の題名を入れる（原因の確かめ。学習は FT_TITLE=1 なのに予測は題名なしだった。research/unknown/findings.md）
            case "$out_path" in materials/pool/work/*/pred_c2t_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40202377192; want=44404b339a9c3023d23f5bac67bdb81ad3aa64a16a95b3d7007f5e6f5b78fcf4; label="C2 種子 1・題名あり（原因の確かめ）"
            extra="--titles research/unknown/titles_all.json --repeat-reason c2-with-titles-root-cause-20261030"
          elif [ "$model" = "c3a" ]; then
            # 2026-10-29：C3a（C2 の設定で、確かめの 6 陣を除いた教材庫 28,486 列、run 40777786620 の種子 1）。事前記録 bench/c3_prereg_20261029.md の判定のため
            case "$out_path" in materials/pool/work/*/pred_c3a_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40777786620; want=680d7fdbed77cd75297a68862d58d3cb33aa3a9a260f5a7b509b2abd7bf044b3; label="C3a（教材庫 28,486 列＋題名、種子 1）"
          elif [ "$model" = "c3b" ]; then
            # 2026-10-29：C3b（C3a ＋ 銀 A 26,283 列で 1 段目、run 40789354990 で回収した種子 1）。事前記録 bench/c3_prereg_20261029.md 第 2 回の判定のため
            case "$out_path" in materials/pool/work/*/pred_c3b_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40789354990; want=e02c72d4386be879d72ae00a17347f25c559a3acf8356f650b46d9376de91d95; label="C3b（銀 A → 教材庫 28,486 列＋題名、種子 1）"
          elif [ "$model" = "c3u" ]; then
            # 2026-10-29：C3u（C3a ＋ 単位の列の見出しを広げた、b064・b065 も除く、run 40847406493 の種子 1）。事前記録 bench/c3u_prereg_20261029.md
            case "$out_path" in materials/pool/work/*/pred_c3u_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40847406493; want=c10f2d7dadd16bc230e0abe5eee14f1f3eb759d0fcae2ac191af0baab990e2aa; label="C3u（単位の見出しを広げた教材庫＋題名、種子 1）"
          elif [ "$model" = "c3s" ]; then
            # 2026-10-29：C3s（C3u ＋ 掃除した銀 16,586 列で 1 段目、run 40859140256 の種子 1）。事前記録 bench/c3s_prereg_20261029.md
            case "$out_path" in materials/pool/work/*/pred_c3s_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=40859140256; want=aedf59d66563872da2027f38ebaf46330512547d7066253fd2d0c601827e9405; label="C3s（掃除した銀 → 教材庫＋題名、種子 1）"
          elif [ "$model" = "e5" ]; then
            case "$out_path" in materials/label_assist/*_e5base_seed1.json|materials/pool/work/*/pred_e5base_seed1.json) ;; *) echo "出力の名前が違う"; exit 1;; esac
            run_id=39506074807; want=38c5b3442a5825d3b46e484897e5cce2d5cabbf4dfc051722cfcfafa81187fb7; label="E5-base 種子 1"
          else
            echo "モデルの名前が違う"; exit 1
          fi
          { echo "proceed=true"; echo "set=$set_path"; echo "out=$out_path"; echo "model=$model"; echo "run_id=$run_id"; echo "want=$want"; echo "label=$label"; echo "extra=${extra:-}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.req.outputs.proceed == 'true'
        with: { python-version: '3.11' }
      - name: CPU の推論の道具
        if: steps.req.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn 'transformers==5.16.1' 'tokenizers==0.23.1' 'safetensors==0.8.0' sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        if: steps.req.outputs.proceed == 'true'
        with:
          name: jitsuris-model
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/e5-model
      - name: 重みの SHA-256 を照合（E5-base 種子 1、または C1 種子 1）
        if: steps.req.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          ck = Path("/tmp/e5-model/ft_out_job1")
          m = json.loads((ck / "manifest.json").read_text(encoding="utf-8"))
          name, meta = next(iter(m["saved_model"]["weights"].items()))
          want = "${{ steps.req.outputs.want }}"
          got = hashlib.sha256((ck / name).read_bytes()).hexdigest()
          if got != want or meta["sha256"] != want:
              raise SystemExit("weight verification failed")
          print("verified")
          PY
      - name: 予測（ラベルは読まない）
        if: steps.req.outputs.proceed == 'true'
        env: { TOKENIZERS_PARALLELISM: 'false' }
        run: |
          python evaluate_independent.py predict --set "${{ steps.req.outputs.set }}" --checkpoint /tmp/e5-model/ft_out_job1 \
            --out "${{ steps.req.outputs.out }}" --ledger materials/label_assist/ledger.jsonl --device cpu ${{ steps.req.outputs.extra }}
          echo "done ${{ steps.req.outputs.set }} ${{ steps.req.outputs.out }}" > materials/label_assist/predict.request
      - name: 予測と台帳だけを保存
        if: steps.req.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.req.outputs.out }}" materials/label_assist/ledger.jsonl materials/label_assist/predict.request
          git commit -m "ラベルの手伝い：${{ steps.req.outputs.label }} の予測（自動）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
