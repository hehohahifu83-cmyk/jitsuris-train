name: 教材の £ の直しを元のファイルと照合する
# 2026-11-01 Claude。research/valuefix/verify_bytes.py。表を取り直して照合するだけで、教材庫は書き換えない。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research/valuefix/verify.request]
permissions:
  contents: write
concurrency: { group: valuefix-verify, cancel-in-progress: false }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -q pytest && python -m pytest -q tests/test_value_fix.py
      - run: python -I research/valuefix/verify_bytes.py
      - name: 保存
        run: |
          echo done > research/valuefix/verify.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/valuefix/verify.json research/valuefix/verify.md research/valuefix/verify.request
          git diff --cached --quiet && exit 0
          git commit -m "教材の £ の直しを元のファイルと照合した（自動）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
