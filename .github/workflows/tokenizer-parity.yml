name: トークナイザの正規化の一致試験
# ブラウザ（JavaScript）の正規化 browser_test/charsmap.mjs が、学習時の Hugging Face tokenizers（Rust）と同じ答えを出すか調べる。
# Python 側で正解データを作り（tokenizer_fixtures.py）、Node で全文字・組み合わせ・ランダム文を突き合わせる（browser_test/charsmap.test.mjs）。
# 軽い版の正解データ（browser_test/fixtures/）を bot が commit するので、手元の Node でも同じ試験ができる。
concurrency: { group: tokenizer-parity, cancel-in-progress: false }
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tokenizer_fixtures.py, edge_texts.py, 'browser_test/charsmap*.mjs', tests/test_tokenizer_fixtures.py, .github/workflows/tokenizer-parity.yml]
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 依存を入れる
        run: python -m pip install --upgrade pip && python -m pip install tokenizers
      - name: 部品の検査（Python と Node の単体試験）
        shell: bash
        run: |
          python -m unittest tests.test_tokenizer_fixtures 2>&1 | tail -5
          node --test browser_test/charsmap.unit.test.mjs 2>&1 | grep -E '^(# (tests|pass|fail)|not ok)'
      - name: 正解データを作る（Hugging Face tokenizers の Rust 実装）
        id: fx
        continue-on-error: true
        shell: bash
        run: python tokenizer_fixtures.py --model intfloat/multilingual-e5-small --full fx_full --small browser_test/fixtures --small-max-interesting 4000 --small-random 1500 2>&1 | tee fixtures.log | tail -40
      - name: JS の正規化を全部の正解データと比べる
        id: cmp
        continue-on-error: true
        shell: bash
        run: node browser_test/charsmap.test.mjs fx_full 2>&1 | tee parity.log | tail -60
      - name: 軽い版（commit する正解データ）でも比べる
        id: small
        continue-on-error: true
        shell: bash
        run: node browser_test/charsmap.test.mjs browser_test/fixtures 2>&1 | tee parity_small.log | tail -12
      - name: 記録する（軽い版の正解データとまとめ）
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee record.log) 2>&1
          set -x
          T=$(mktemp -d)
          { echo "# トークナイザの正規化の一致試験（GitHub Actions）"; echo; echo "run: ${{ github.run_id }}　commit: ${{ github.sha }}"; echo
            echo "## 正解データの作成（Python・tokenizers）"; echo '```'; tail -40 fixtures.log 2>/dev/null; echo '```'
            echo "## JS の正規化との突き合わせ（全部）"; echo '```'; sed -n '/=== 要点/,$p' parity.log 2>/dev/null | head -40; echo '```'
            echo "### 不一致の例（最初の数件）"; echo '```'; sed -n '1,/=== 要点/p' parity.log 2>/dev/null | head -60 | cut -c1-300; echo '```'
            echo "## 軽い版（commit した正解データ）との突き合わせ"; echo '```'; sed -n '/=== 要点/,$p' parity_small.log 2>/dev/null | head -12; echo '```'; } > "$T/tokenizer_parity_summary.md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$T/fixtures"; cp browser_test/fixtures/* "$T/fixtures/" 2>/dev/null || true
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$T/tokenizer_parity_summary.md" bench/
            git add bench/tokenizer_parity_summary.md
            if [ -f "$T/fixtures/charsmap.b64" ]; then mkdir -p browser_test/fixtures && cp "$T"/fixtures/* browser_test/fixtures/ && git add browser_test/fixtures; fi
            git diff --cached --quiet && break
            git commit -q -m "トークナイザの正規化の一致試験の結果と、軽い正解データ"
            git push -q && break
            sleep 3
          done
      - name: 要点を注（アノテーション）に出す
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          def emit(path, title, n=3200, tail=30):
              if not os.path.exists(path): return
              ls = open(path, encoding="utf-8", errors="replace").read().splitlines()[-tail:]
              t = "\n".join(l[-260:] for l in ls)[-n:]
              t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={title}::{t}")
          emit("fixtures.log", "fixtures", tail=22)
          emit("parity.log", "parity", n=3800, tail=36)
          emit("parity_small.log", "parity_small", tail=10)
          emit("record.log", "record", tail=14)
          PY
      - name: どれかが失敗なら失敗にする
        if: steps.fx.outcome == 'failure' || steps.cmp.outcome == 'failure' || steps.small.outcome == 'failure'
        run: exit 1
