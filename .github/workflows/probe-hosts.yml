name: 公開元の API に Actions から届くかを調べる（英国・スイスの 403）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "materials/pool/probe_hosts.request"

permissions:
  contents: write

concurrency:
  group: probe-hosts
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 依頼を読む
        id: req
        run: |
          read -r cmd out <<< "$(head -1 materials/pool/probe_hosts.request)"
          if [ "$cmd" != "probe" ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$out" in materials/pool/probe/*.json) ;; *) echo "出力の場所が違う"; exit 1;; esac
          { echo "proceed=true"; echo "out=$out"; } >> "$GITHUB_OUTPUT"
      - name: 状態コードだけを調べる（データの中身は保存しない）
        if: steps.req.outputs.proceed == 'true'
        run: python -I materials/pool/probe_hosts.py "${{ steps.req.outputs.out }}"
      - name: 保存
        if: steps.req.outputs.proceed == 'true'
        run: |
          echo "done ${{ steps.req.outputs.out }}" > materials/pool/probe_hosts.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.req.outputs.out }}" materials/pool/probe_hosts.request
          git commit -m "公開元の API に届くかの調査（自動）"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
