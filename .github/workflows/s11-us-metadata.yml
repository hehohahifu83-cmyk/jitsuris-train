name: S11 3.4 US Socrata metadata discovery

on:
  push:
    branches: [main]
    paths:
      - "materials/s11_3_4_us_discovery.request"

permissions:
  contents: write

concurrency:
  group: s11-3-4-us-metadata-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自己テスト
        run: python -I materials/s11_3_4_discover_us.py --self-test
      - name: 依頼を検査
        id: request
        run: |
          set -euo pipefail
          read -r command run_date < materials/s11_3_4_us_discovery.request
          if [[ "$command" == "done" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$command" == "register" ]]
          [[ "$run_date" =~ ^2026[0-9]{4}(-v[0-9]+)?$ ]]
          echo "execute=true" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
      - name: 公開元だけを登録（データセットメタデータ未照会）
        if: steps.request.outputs.execute == 'true'
        run: python -I materials/s11_3_4_discover_us.py --mode register
      - name: 登録結果と依頼状態を保存
        if: steps.request.outputs.execute == 'true'
        env:
          RUN_DATE: ${{ steps.request.outputs.run_date }}
        run: |
          set -euo pipefail
          echo "done register $RUN_DATE" > materials/s11_3_4_us_discovery.request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/s11_3_4_discover_us.py materials/s11_3_4_us_discovery.request
          git add independent_eval/allocation.json independent_eval/allocation_sources_socrata_20261022.json materials/s11_3_4_us_registration_20261022.json
          git commit -m "S11 3.4 米国 Socrata 公開元を登録"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
